name: Kernel Qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      flavour:
        description: Kernel flavour to qualify
        type: choice
        options: [both, standard, lts]
        default: both

permissions:
  contents: read

concurrency:
  group: kernel-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      flavours: ${{ steps.plan.outputs.flavours }}
      scenarios: ${{ steps.plan.outputs.scenarios }}
      kubernetes-version: ${{ steps.plan.outputs.kubernetes-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          FLAVOUR: ${{ inputs.flavour }}
        run: |
          mkdir -p _build
          options=(--ci)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            case "$FLAVOUR" in
              both) flavours=(standard lts) ;;
              standard|lts) flavours=("$FLAVOUR") ;;
              *) exit 1 ;;
            esac
            printf 'kernels/manual/x86_64/%s.json\0' "${flavours[@]}" > _build/kernel-changes
          else
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              base="$BASE_SHA"
            else
              options+=(--main)
              base="$BEFORE_SHA"
              [[ -n "$base" && "$base" != 0000000000000000000000000000000000000000 ]] || base="$(git hash-object -t tree /dev/null)"
            fi
            git diff --name-only --no-renames -z "$base" HEAD > _build/kernel-changes
          fi
          go run ./cmd/katl-vmtest-plan "${options[@]}" < _build/kernel-changes > _build/kernel-plan.json
          go run ./cmd/katl-kubernetes-release presubmit --base "${base:-HEAD}" > _build/kernel-kubernetes-plan.json
          {
            echo "flavours=$(jq -c .kernelFlavours _build/kernel-plan.json)"
            echo "scenarios=$(jq -c '{include: .groups}' _build/kernel-plan.json)"
            echo "kubernetes-version=$(jq -r '.include[0].payloadVersion // empty' _build/kernel-kubernetes-plan.json)"
          } >> "$GITHUB_OUTPUT"
          cat _build/kernel-plan.json >> "$GITHUB_STEP_SUMMARY"

  vms:
    name: VM (${{ matrix.flavour }})
    needs: plan
    if: needs.plan.outputs.flavours != '[]'
    strategy:
      fail-fast: false
      matrix:
        flavour: ${{ fromJSON(needs.plan.outputs.flavours) }}
    uses: ./.github/workflows/hosted-vmtests.yml
    with:
      flavour: ${{ matrix.flavour }}
      scenarios: ${{ needs.plan.outputs.scenarios }}
      kubernetes-version: ${{ needs.plan.outputs.kubernetes-version }}

  drivers:
    name: Drivers (${{ matrix.flavour }})
    needs: plan
    if: needs.plan.outputs.flavours != '[]'
    strategy:
      fail-fast: false
      matrix:
        flavour: ${{ fromJSON(needs.plan.outputs.flavours) }}
    uses: ./.github/workflows/kernel-drivers.yml
    with:
      flavour: ${{ matrix.flavour }}

  result:
    name: Kernel qualification
    if: always()
    needs: [plan, vms, drivers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected kernel gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            (.plan.outputs.flavours | fromjson) as $flavours |
            .plan.result == "success" and
            ($flavours | type == "array") and
            ([.vms.result, .drivers.result] |
             all(.[]; if ($flavours | length) > 0 then . == "success"
                      else . == "skipped" end))
          ' <<< "$NEEDS"
