name: Kernel drivers

on:
  workflow_call:
    inputs:
      flavour:
        type: string
        required: true
      input-digest:
        type: string
        required: true

jobs:
  record-driver-start:
    name: Record pending driver qualification
    if: >-
      (github.ref == 'refs/heads/main' &&
       (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) ||
      (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      FLAVOUR: ${{ inputs.flavour }}
      DIGEST: ${{ inputs.input-digest }}
      STATE: pending
    steps:
      - name: Publish the driver outcome
        run: &publish-driver-outcome |
          case "$FLAVOUR" in standard|lts) ;; *) exit 1 ;; esac
          if [[ ! "$DIGEST" =~ ^v[0-9]+:[a-f0-9]{64}$ ]]; then
            echo "::warning::No readable driver input digest for $FLAVOUR on $GITHUB_SHA"
            exit 0
          fi
          # GitHub stores this against the commit, so an exact-SHA main push
          # inherits the merge group's result and its original run URL.
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f "context=katl/driver-qualification/$FLAVOUR/$DIGEST" \
            -f "state=$STATE" -f "description=$DIGEST" \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" >/dev/null

  drivers:
    name: drivers (${{ inputs.input-digest }})
    needs: [record-driver-start]
    if: >-
      !cancelled() &&
      (needs.record-driver-start.result == 'success' || needs.record-driver-start.result == 'skipped')
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      KATL_FLAVOUR: ${{ inputs.flavour }}
      KATL_MKOSI_BUILD_DIR: ${{ github.workspace }}/_build/mkosi
      KATL_CONTAINER_RUNTIME: docker
      KATL_MKOSI_IMAGE: localhost/katl-kernel-inputs:builder
      KATL_VMTEST_IMAGE_SUPPORT: '0'
      KATL_BUILD_COMMIT: ${{ github.sha }}
      KATL_VMTEST_KVM: 'on'
      KATL_VMTEST_KEEP: failed
      KATL_VMTEST_DEBUG_ON_FAILURE: '0'
      KATL_OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
      KATL_OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
      KATL_VMTEST_GO: ${{ github.workspace }}/.github/scripts/hosted-vmtest-go
      KATL_VMTEST_RUN_DIR: ${{ github.workspace }}/_build/kernel-journey
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/mkosi-builder
        with:
          image: ${{ env.KATL_MKOSI_IMAGE }}
      - name: Select the committed kernel lock
        run: |
          case "$KATL_FLAVOUR" in standard|lts) ;; *) exit 1 ;; esac
          lock="kernels/fedora-$(scripts/fedora-release)/x86_64/$KATL_FLAVOUR.json"
          test -f "$lock"
          echo "KATL_KERNEL_LOCK=$GITHUB_WORKSPACE/$lock" >> "$GITHUB_ENV"
          echo "KATL_VERSION=$(date -u +%Y.%-m).0-dev.0" >> "$GITHUB_ENV"
      - name: Install module inspection tools
        run: .github/scripts/hosted-apt-install systemd-container kmod squashfs-tools
      - name: Build both boot artifacts and every release recipe
        run: |
          scripts/mkosi build-runtime
          scripts/mkosi build-installer
          scripts/build-release-extensions
          scripts/assemble-release-extensions
      - uses: ./.github/actions/hosted-vmtest
      - name: Exercise the production DRBD driver
        run: |
          KATL_EXTENSION_RELEASE=_build/mkosi/release-extensions.json \
            scripts/mkosi build-katlos-upgrade-image
          mkdir -p _build/qualified-kernel
          mv _build/mkosi/katlos-upgrade-* _build/qualified-kernel/
          images=(_build/qualified-kernel/katlos-upgrade-*.squashfs)
          test "${#images[@]}" = 1
          export KATL_VMTEST_DRBD_UPGRADE_IMAGE="$GITHUB_WORKSPACE/${images[0]}"
          export KATL_VMTEST_IMAGE_SUPPORT=1
          scripts/mkosi build-katlos-install-image
          scripts/mkosi build-installer
          scripts/mkosi --profile vmtest-drbd-tools -f build
          # The VM runner pins the install image named in the completed artifact index.
          go run ./cmd/katl-mkosi-artifacts write
          go run ./cmd/katl-mkosi-artifacts path katlos-install-image >/dev/null
          .github/scripts/hosted-vmtest-measure drbd .github/scripts/hosted-vmtest-run \
            --artifact-set=install --no-rebuild ./internal/vmtest \
            -run '^TestInstalledRuntimeDRBDReplication$' -count=1 -json -timeout 40m
      - name: Record the qualified commit and inputs
        id: record-qualification
        env:
          INPUT_DIGEST: ${{ inputs.input-digest }}
        run: |
          printf 'Qualified commit: %s\n\n' "\`$KATL_BUILD_COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
          {
            printf '%s\n' '```json'
            jq --arg commit "$KATL_BUILD_COMMIT" --arg digest "$INPUT_DIGEST" '
              {qualifiedCommit: $commit, inputDigest: ($digest | select(length > 0) // null),
               flavour, kernelRelease, reference, packages: [.packages[] | {name, nevra, digest}]}
            ' "$KATL_KERNEL_LOCK"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect VM diagnostics
        id: diagnostics
        if: always()
        run: .github/scripts/hosted-vmtest-diagnostics
      - uses: actions/upload-artifact@v7
        id: upload-diagnostics
        if: always()
        with:
          name: kernel-driver-${{ inputs.flavour }}-${{ github.run_id }}
          path: |
            _build/hosted-evidence/
            _build/kernel-journey/**/*.log
            _build/kernel-journey/**/*.json
            _build/kernel-journey/**/*.xml
            _build/kernel-journey/**/*.txt
            _build/kernel-journey/**/*.stdout
            _build/kernel-journey/**/*.stderr
            _build/kernel-journey/**/stdout
            _build/kernel-journey/**/stderr
          retention-days: 3

  record-driver-result:
    name: Record final driver qualification
    needs: [record-driver-start, drivers]
    if: always() && needs.record-driver-start.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      FLAVOUR: ${{ inputs.flavour }}
      DIGEST: ${{ inputs.input-digest }}
      STATE: ${{ needs.drivers.result == 'success' && 'success' || 'failure' }}
    steps:
      - name: Publish the driver outcome
        run: *publish-driver-outcome
