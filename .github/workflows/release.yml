name: Release

on:
  workflow_dispatch:
    inputs:
      retry:
        description: Reason for retrying a build that did not qualify
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  decide:
    name: Decide
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      statuses: read
      attestations: read
      deployments: read
    outputs:
      action: ${{ steps.decision.outputs.action }}
      state: ${{ steps.decision.outputs.state }}
      version: ${{ steps.decision.outputs.version }}
      commit: ${{ steps.decision.outputs.commit }}
      candidate: ${{ steps.decision.outputs.candidate }}
      reason: ${{ steps.decision.outputs.reason }}
      build-run: ${{ steps.decision.outputs.build-run }}
      build-attempt: ${{ steps.decision.outputs.build-attempt }}
      digest: ${{ steps.decision.outputs.digest }}
      attempt: ${{ steps.decision.outputs.attempt }}
      extension-bundles: ${{ steps.decision.outputs.extension-bundles }}
    steps:
      - &checkout
        uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          persist-credentials: false
      - &setup-go
        uses: ./.github/actions/setup-go
        timeout-minutes: 2
      - name: Decide the release action
        id: decision
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY: ${{ inputs.retry }}
        run: |
          decision="$(scripts/katl-release next --retry "$RETRY")"
          action="$(jq -r '.action' <<< "$decision")"
          if [[ "$action" == refuse ]]; then
            jq -r '.message' <<< "$decision" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          commit="$(jq -r '.commit' <<< "$decision")"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ || "$commit" != "$GITHUB_SHA" ]]; then
            echo "The decision names commit $commit, but this run builds $GITHUB_SHA. Dispatch the release action again." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          reason="$(jq -r '.reason // ""' <<< "$decision")"
          if [[ -n "$reason" ]]; then
            printf 'Retry reason: %s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          fi
          extensions="$(scripts/katl-release extension-bundles "$commit")"
          delimiter="$(cat /proc/sys/kernel/random/uuid)"
          {
            jq -r 'to_entries[] | select(.key | IN("action", "state", "version", "commit", "candidate", "build_run", "build_attempt", "digest")) | "\(.key | gsub("_"; "-"))=\(.value)"' <<< "$decision"
            printf 'extension-bundles=%s\n' "$extensions"
            printf 'attempt=%s\nreason<<%s\n%s\n%s\n' "$GITHUB_RUN_ATTEMPT" "$delimiter" "$reason" "$delimiter"
          } >> "$GITHUB_OUTPUT"

  start:
    name: Record build start
    needs: decide
    if: >-
      needs.decide.outputs.action == 'candidate' || needs.decide.outputs.action == 'retry-candidate' ||
      needs.decide.outputs.action == 'final' || needs.decide.outputs.action == 'retry-final'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      statuses: write
    env:
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - &attempt-guard
        name: Require a decision from this attempt
        timeout-minutes: 2
        env:
          DECISION_ATTEMPT: ${{ needs.decide.outputs.attempt }}
        run: |
          if [[ "$DECISION_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo "This attempt has no decision of its own. Dispatch the release action again."
            exit 1
          fi
      - *checkout
      - *setup-go
      - name: Record the start of the build
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/katl-release record "$VERSION" building
      - name: Create the candidate tag
        timeout-minutes: 2
        if: needs.decide.outputs.action == 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.decide.outputs.commit }}
        run: |
          tag="$(scripts/katl-release tag-name "$VERSION")"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$COMMIT"

  build:
    name: Build
    needs: [decide, start]
    if: >-
      needs.decide.outputs.attempt == github.run_attempt &&
      (needs.decide.outputs.action == 'candidate' || needs.decide.outputs.action == 'retry-candidate' ||
      needs.decide.outputs.action == 'final' || needs.decide.outputs.action == 'retry-final')
    uses: ./.github/workflows/release-artifacts.yml
    with:
      version: ${{ needs.decide.outputs.version }}
      commit: ${{ needs.decide.outputs.commit }}
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write

  qualify:
    name: Record qualification
    needs: [decide, start, build]
    if: >-
      always() && needs.start.result == 'success' &&
      (needs.decide.outputs.action == 'candidate' || needs.decide.outputs.action == 'retry-candidate' ||
      needs.decide.outputs.action == 'final' || needs.decide.outputs.action == 'retry-final')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      attestations: read
      statuses: write
    env:
      VERSION: ${{ needs.decide.outputs.version }}
      COMMIT: ${{ needs.decide.outputs.commit }}
    outputs:
      digest: ${{ steps.qualification.outputs.digest }}
    steps:
      - *attempt-guard
      - *checkout
      - *setup-go
      - name: Require a validated bundle
        timeout-minutes: 2
        id: validation
        env:
          VALIDATION: ${{ needs.build.outputs.validation }}
          DIGEST: ${{ needs.build.outputs.sha256sums }}
          ARTIFACT: ${{ needs.build.outputs.artifact }}
        run: |
          if [[ "$VALIDATION" != success || ! "$DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The build did not return successful Release validation and a bundle checksum digest. Check the Build jobs." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          expected="$(scripts/katl-release bundle-name "$VERSION" "$COMMIT")"
          if [[ "$ARTIFACT" != "$expected" ]]; then
            echo "The build did not return the expected bundle $expected. Check the Build jobs." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Download the validated bundle
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ needs.build.outputs.artifact }}
        run: .github/scripts/hosted-download artifact "$BUNDLE" dist
      - name: Verify, summarize and record qualification
        timeout-minutes: 3
        id: qualification
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.build.outputs.sha256sums }}
          CANDIDATE: ${{ needs.decide.outputs.candidate }}
          ACTION: ${{ needs.decide.outputs.action }}
        run: |
          tag="$(scripts/katl-release tag-name "$VERSION")"
          scripts/katl-release verify --branch "$tag" "$COMMIT" dist
          actual="$(sha256sum dist/SHA256SUMS)"
          if [[ "${actual%% *}" != "$DIGEST" ]]; then
            echo "The downloaded bundle differs from the validated bundle. Check the Build artifacts." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            printf '## Qualified KatlOS %s\n\nCommit: `%s`\n\n' "$VERSION" "$COMMIT"
            if [[ "$ACTION" == final || "$ACTION" == retry-final ]]; then
              printf 'Follows candidate %s.\n\n' "$CANDIDATE"
            fi
            printf 'SHA256SUMS digest: `%s`\n' "$DIGEST"
            if [[ "$ACTION" == final || "$ACTION" == retry-final ]]; then
              printf '\n```text\n'
              cat dist/SHA256SUMS
              printf '```\n\n'
              cat dist/RELEASE_NOTES.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          scripts/katl-release record "$VERSION" qualified "$DIGEST"
      - name: Record failure before qualification
        timeout-minutes: 2
        if: failure() && steps.qualification.outcome != 'success' && needs.decide.outputs.attempt == github.run_attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/katl-release record "$VERSION" failed

  publish-candidate:
    name: Publish pre-release
    needs: [decide, qualify]
    if: >-
      always() && needs.decide.result == 'success' &&
      (needs.decide.outputs.action == 'resume-candidate' ||
      ((needs.decide.outputs.action == 'candidate' || needs.decide.outputs.action == 'retry-candidate') &&
      needs.qualify.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    permissions:
      contents: write
      packages: write
      actions: read
      attestations: read
    env:
      VERSION: ${{ needs.decide.outputs.version }}
      COMMIT: ${{ needs.decide.outputs.commit }}
      DIGEST: ${{ needs.decide.outputs.digest || needs.qualify.outputs.digest }}
      EXTENSION_BUNDLES: ${{ needs.decide.outputs.extension-bundles }}
    steps:
      - *attempt-guard
      - *checkout
      - *setup-go
      - name: Require a release candidate
        timeout-minutes: 2
        run: scripts/katl-release require-candidate "$VERSION"
      - &bundle-name
        name: Resolve the bundle name
        timeout-minutes: 2
        id: bundle
        run: |
          name="$(scripts/katl-release bundle-name "$VERSION" "$COMMIT")"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Find artifacts of the recorded build attempt
        timeout-minutes: 2
        id: recorded
        if: needs.decide.outputs.action == 'resume-candidate'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ needs.decide.outputs.build-run }}
          BUILD_ATTEMPT: ${{ needs.decide.outputs.build-attempt }}
        run: |
          artifacts="$(scripts/katl-release candidate-artifacts "$VERSION" "$COMMIT" "$BUILD_RUN" "$BUILD_ATTEMPT")"
          jq -r '"bundle=\(.bundle)"' <<< "$artifacts" >> "$GITHUB_OUTPUT"
          echo "extensions=$(jq -c 'del(.bundle)' <<< "$artifacts")" >> "$GITHUB_OUTPUT"
      - name: Download the candidate bundle
        if: steps.recorded.outputs.bundle == ''
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.bundle.outputs.name }}
        run: .github/scripts/hosted-download artifact "$BUNDLE" dist
      # A resume downloads by the IDs candidate-artifacts bound to the recorded
      # build attempt, because names can recur in another attempt of that run.
      - name: Download the recorded candidate bundle
        if: steps.recorded.outputs.bundle != ''
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.bundle.outputs.name }}
          BUNDLE_ID: ${{ steps.recorded.outputs.bundle }}
          BUILD_RUN: ${{ needs.decide.outputs.build-run }}
        run: .github/scripts/hosted-download --id "$BUNDLE_ID" artifact "$BUNDLE" dist "$BUILD_RUN"
      - &check-digest
        name: Confirm the qualified bundle digest
        timeout-minutes: 2
        run: |
          actual="$(sha256sum dist/SHA256SUMS)"
          if [[ ! "$DIGEST" =~ ^[0-9a-f]{64}$ || "${actual%% *}" != "$DIGEST" ]]; then
            echo "The downloaded bundle differs from the qualified bundle. Check the recorded build artifacts."
            exit 1
          fi
      # A resume downloads by the IDs candidate-artifacts bound to the recorded
      # build attempt; otherwise each inventory name selects this run's.
      - name: Download candidate extension publication inputs
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ github.token }}
          RECORDED: ${{ steps.recorded.outputs.extensions }}
          BUILD_RUN: ${{ needs.decide.outputs.build-run }}
        run: |
          if [[ -z "$RECORDED" ]]; then
            jq -er '.bundles[].name' <<< "$EXTENSION_BUNDLES" |
            while IFS= read -r name; do
              .github/scripts/hosted-download artifact "$name" "artifacts/$name"
            done
            exit 0
          fi
          jq -r '.bundles[] | [.flavour, .name] | @tsv' <<< "$EXTENSION_BUNDLES" |
          while IFS=$'\t' read -r flavour name; do
            id="$(jq -er --arg flavour "$flavour" '.[$flavour]' <<< "$RECORDED")"
            .github/scripts/hosted-download --id "$id" artifact "$name" "artifacts/$name" "$BUILD_RUN"
          done
      - &check-extensions
        name: Compare extension inputs with the bundle
        timeout-minutes: 5
        run: |
          jq -r '.bundles[] | [.flavour, .name] | @tsv' <<< "$EXTENSION_BUNDLES" |
          while IFS=$'\t' read -r flavour name; do
            directory="artifacts/$name"
            go run ./cmd/katl-mkosi-artifacts match-release-extensions dist "$flavour" \
              "$directory/release-extensions.json" "$directory/extension-bundles"
          done
      - name: Draft the pre-release
        timeout-minutes: 7
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/katl-release draft "$VERSION" "$COMMIT" dist
      - &registry-login
        name: Authenticate registry publication
        timeout-minutes: 2
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - &push-extensions
        name: Publish qualified extension bundles
        timeout-minutes: 5
        run: |
          jq -r '.bundles[].name' <<< "$EXTENSION_BUNDLES" |
          while IFS= read -r name; do
            directory="artifacts/$name"
            go run ./cmd/katl-mkosi-artifacts publish-release-extensions \
              "$directory/release-extensions.json" "$directory/extension-bundles"
          done
      - name: Publish the pre-release
        timeout-minutes: 7
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/katl-release publish "$VERSION" "$COMMIT" dist

  publish:
    name: Publish
    needs: [decide, qualify]
    if: needs.decide.outputs.action == 'final' || needs.decide.outputs.action == 'retry-final'
    runs-on: ubuntu-24.04
    # GitHub starts this budget when the job is assigned a runner, after the
    # release environment's approval, so the approval wait is not counted here.
    timeout-minutes: 110
    environment: release
    permissions:
      contents: write
      packages: write
      actions: read
      attestations: read
      statuses: read
      deployments: read
    env:
      VERSION: ${{ needs.decide.outputs.version }}
      COMMIT: ${{ needs.decide.outputs.commit }}
      DIGEST: ${{ needs.qualify.outputs.digest }}
      EXTENSION_BUNDLES: ${{ needs.decide.outputs.extension-bundles }}
    steps:
      - *attempt-guard
      - *checkout
      - name: Verify the publishing credential
        timeout-minutes: 2
        id: credential
        uses: ./.github/actions/release-credential
        with:
          app-id: ${{ vars.KATL_RELEASE_APP_ID }}
          private-key: ${{ secrets.KATL_RELEASE_APP_PRIVATE_KEY }}
      - name: Summarize the publishing credential
        timeout-minutes: 2
        run: |
          echo "Publishing credential: katl-release App." >> "$GITHUB_STEP_SUMMARY"
      - *setup-go
      - name: Confirm the final decision after approval
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/katl-release confirm-final "$VERSION" "$COMMIT" "$DIGEST"
      - *bundle-name
      - name: Download the qualified bundle
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.bundle.outputs.name }}
        run: .github/scripts/hosted-download artifact "$BUNDLE" dist
      - *check-digest
      - name: Download both qualification records
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          KATL_DOWNLOAD_ATTEMPT_SECONDS: 60
          QUALIFIED: katl-qualified-*-${{ github.sha }}
        run: .github/scripts/hosted-download artifacts "$QUALIFIED" evidence
      - name: Confirm the bytes qualified by Production VM
        timeout-minutes: 2
        run: |
          records="$(jq -r '.bundles[].flavour' <<< "$EXTENSION_BUNDLES")"
          evidence=()
          while IFS= read -r flavour; do
            evidence+=("$flavour=evidence/katl-qualified-$flavour-$COMMIT/SHA256SUMS")
          done <<< "$records"
          scripts/katl-release equivalent dist "${evidence[@]}"
      - name: Download final extension publication inputs
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -er '.bundles[].name' <<< "$EXTENSION_BUNDLES" |
          while IFS= read -r name; do
            .github/scripts/hosted-download artifact "$name" "artifacts/$name"
          done
      - *check-extensions
      - name: Draft the final release
        timeout-minutes: 7
        env:
          GH_TOKEN: ${{ steps.credential.outputs.token }}
        run: scripts/katl-release draft "$VERSION" "$COMMIT" dist
      - *registry-login
      - *push-extensions
      - name: Publish the final release and tag
        timeout-minutes: 7
        env:
          GH_TOKEN: ${{ steps.credential.outputs.token }}
        run: scripts/katl-release publish "$VERSION" "$COMMIT" dist
