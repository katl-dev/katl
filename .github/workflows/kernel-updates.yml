name: Kernel Updates

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      fedora_release:
        description: Fedora release to prepare; empty uses the selected base
        type: string
      flavour:
        description: Kernel flavour to update
        type: choice
        default: both
        options: [both, standard, lts]
      standard_release:
        description: Exact standard kernel release; empty discovers the newest
        type: string
      lts_release:
        description: Exact LTS kernel release; empty discovers the newest
        type: string

permissions:
  contents: read
  packages: write

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        flavour: ${{ fromJSON(inputs.flavour == 'standard' && '["standard"]' || inputs.flavour == 'lts' && '["lts"]' || '["standard","lts"]') }}
    uses: ./.github/workflows/kernel-update.yml
    with:
      fedora-release: ${{ inputs.fedora_release || '' }}
      flavour: ${{ matrix.flavour }}
      kernel-release: ${{ matrix.flavour == 'standard' && inputs.standard_release || matrix.flavour == 'lts' && inputs.lts_release || '' }}
    secrets: inherit
