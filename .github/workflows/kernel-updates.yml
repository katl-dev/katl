name: Kernel Updates

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      flavour:
        description: Kernel flavour to update
        type: choice
        options: [both, standard, lts]
        default: both
      standard_release:
        description: Exact standard kernel release; empty discovers the newest
        type: string
      lts_release:
        description: Exact LTS kernel release; empty discovers the newest
        type: string

permissions:
  contents: read

jobs:
  standard:
    if: github.ref == 'refs/heads/main' && inputs.flavour != 'lts'
    concurrency:
      group: kernel-inputs-standard-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/kernel-update.yml
    with:
      flavour: standard
      kernel-release: ${{ inputs.standard_release }}
    secrets: inherit

  lts:
    if: github.ref == 'refs/heads/main' && inputs.flavour != 'standard'
    concurrency:
      group: kernel-inputs-lts-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/kernel-update.yml
    with:
      flavour: lts
      kernel-release: ${{ inputs.lts_release }}
    secrets: inherit
