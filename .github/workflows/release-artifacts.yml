name: Katl Release Artifacts

on:
  # The nightly candidate on main runs the release path at a development version
  # above the pinned upgrade baseline. It restores shared build caches and publishes nothing.
  schedule:
    - cron: '17 3 * * *'
  # A dispatch builds and qualifies a version of the dispatched ref, such as a
  # base-upgrade branch, and publishes nothing.
  workflow_dispatch:
    inputs:
      version:
        description: CalVer embedded in artifacts (for example 2026.7.0-beta.1)
        type: string
        required: true
  # The release workflow calls this one to build and qualify a version it
  # derived, and publishes the result itself; this workflow publishes nothing.
  # GitHub checks every job's permissions against the caller's grant before any
  # job starts, so the calling job grants actions: read, attestations: write,
  # contents: read and id-token: write. The called path builds github.sha:
  # commit must name it, and the caller tags that commit. It uploads its
  # artifacts under the katl- prefix into the caller's run, so the caller makes
  # one call per run and uploads no artifact of its own under that prefix.
  workflow_call:
    inputs:
      version:
        description: Version the caller derived (<version> or <version>-rc.N)
        type: string
        required: true
      commit:
        description: Full SHA of the commit to build; must equal github.sha
        type: string
        required: true
    outputs:
      artifact:
        description: Name of the bundle artifact in the caller's run
        value: ${{ jobs.identity.outputs.artifact-name }}
      sha256sums:
        description: SHA-256 digest of the bundle's SHA256SUMS
        value: ${{ jobs.bundle.outputs.sha256sums }}
      validation:
        description: Outcome of Release validation (success or failure)
        value: ${{ jobs.release-validation.outputs.result }}

permissions:
  contents: read
  actions: read

# Nightly candidates share one group, so two nights never overlap, and each
# dispatch gets its own. A called run's github context is its caller's, so it
# takes a group of its own per run, suffixed so it never equals the caller's.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.commit && github.run_id || github.event_name == 'schedule' && 'nightly' || github.run_id }}${{ inputs.commit && '-call' || '' }}
  cancel-in-progress: false

jobs:
  unit:
    name: Release unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Set up tools
        uses: ./.github/actions/setup-tools
        timeout-minutes: 14
      - name: Allow Bubblewrap user namespaces
        timeout-minutes: 2
        run: nix develop --option builders '' .#ci -c .github/scripts/hosted-hermetic-setup
      - name: Run fast checks
        timeout-minutes: 10
        run: nix develop --option builders '' .#ci -c scripts/check-fast

  vmtests:
    name: VM regression
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        flavour: [standard, lts]
    uses: ./.github/workflows/hosted-vmtests.yml
    with:
      flavour: ${{ matrix.flavour }}

  identity:
    name: Resolve Release Identity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-name: ${{ steps.release.outputs.artifact-name }}
      version: ${{ steps.release.outputs.version }}
      previous-tag: ${{ steps.previous.outputs.tag }}
      retention-days: ${{ github.event_name == 'schedule' && 7 || 30 }}

    steps:
      - name: Check out repository
        timeout-minutes: 2
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        timeout-minutes: 2

      - name: Resolve supported upgrade source
        timeout-minutes: 2
        id: previous
        run: |
          tag="$(scripts/katl-release-artifacts upgrade-baseline)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Resolve release identity
        timeout-minutes: 2
        id: release
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          CALLED_COMMIT: ${{ inputs.commit }}
        run: |
          event="$GITHUB_EVENT_NAME"
          # A called run reports its caller's event; the caller supplies the version.
          if [[ -n "${CALLED_COMMIT:-}" ]]; then
            if [[ "$CALLED_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "::error::called to build $CALLED_COMMIT, but this run builds $GITHUB_SHA from $GITHUB_REF_NAME. Dispatch the Release workflow on the release branch whose head is $CALLED_COMMIT."
              exit 1
            fi
            event=workflow_call
          fi
          if [[ "$event" == schedule ]]; then
            MANUAL_VERSION="$(scripts/katl-release-artifacts dev-version "$PREVIOUS_TAG")"
          fi
          version="$(scripts/katl-release-artifacts version \
            "$event" "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" \
            "$MANUAL_VERSION")"
          artifact_name="$(scripts/katl-release bundle-name "$version" "$GITHUB_SHA")"
          {
            echo "version=$version"
            echo "artifact-name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

  build-standard:
    name: Build standard
    needs: identity
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/production-build.yml
    with:
      flavour: standard
      version: ${{ needs.identity.outputs.version }}
      retention-days: ${{ fromJSON(needs.identity.outputs.retention-days) }}

  build-lts:
    name: Build lts
    needs: identity
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/production-build.yml
    with:
      flavour: lts
      version: ${{ needs.identity.outputs.version }}
      retention-days: ${{ fromJSON(needs.identity.outputs.retention-days) }}

  bundle:
    name: Bundle Kernel Flavours
    needs: [identity, build-standard, build-lts]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: read # combine-flavours downloads with hosted-download.
      attestations: write
      contents: read
      id-token: write
    outputs:
      sha256sums: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        timeout-minutes: 2
      - uses: ./.github/actions/combine-flavours
        timeout-minutes: 21
      - name: Attest staged release artifacts
        timeout-minutes: 2
        if: inputs.commit
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Digest release checksums
        timeout-minutes: 2
        id: digest
        if: inputs.commit
        run: |
          digest="$(sha256sum dist/SHA256SUMS)"
          echo "sha256=${digest%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        timeout-minutes: 10
        with:
          name: ${{ needs.identity.outputs.artifact-name }}
          path: dist/
          if-no-files-found: error
          retention-days: ${{ needs.identity.outputs.retention-days }}
          compression-level: 0


  qualification-standard:
    name: Production VM (standard)
    needs: [identity, build-standard]
    uses: ./.github/workflows/production-vmtests.yml
    with:
      flavour: standard
      artifact-name: ${{ needs.build-standard.outputs.artifact }}
      previous-tag: ${{ needs.identity.outputs.previous-tag }}

  qualification-lts:
    name: Production VM (lts)
    needs: [identity, build-lts]
    uses: ./.github/workflows/production-vmtests.yml
    with:
      flavour: lts
      artifact-name: ${{ needs.build-lts.outputs.artifact }}
      previous-tag: ${{ needs.identity.outputs.previous-tag }}

  qualified-bytes:
    name: Verify Qualified Bytes
    needs: [identity, bundle, qualification-standard, qualification-lts]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        timeout-minutes: 2
      - name: Download the bundle
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ needs.identity.outputs.artifact-name }}
        run: .github/scripts/hosted-download artifact "$BUNDLE" dist
      - name: Download qualified checksums
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          KATL_DOWNLOAD_ATTEMPT_SECONDS: 60
          QUALIFIED: katl-qualified-*-${{ github.sha }}
        run: .github/scripts/hosted-download artifacts "$QUALIFIED" evidence
      - timeout-minutes: 2
        run: |
          scripts/katl-release equivalent dist \
            "standard=evidence/katl-qualified-standard-$GITHUB_SHA/SHA256SUMS" \
            "lts=evidence/katl-qualified-lts-$GITHUB_SHA/SHA256SUMS"

  release-validation:
    name: Release validation
    if: always()
    needs:
      - identity
      - bundle
      - vmtests
      - qualification-standard
      - qualification-lts
      - qualified-bytes
      - unit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      result: ${{ steps.verdict.outcome }}
    steps:
      - id: verdict
        timeout-minutes: 2
        env:
          UNIT: ${{ needs.unit.result }}
          BUNDLE: ${{ needs.bundle.result }}
          REGRESSION: ${{ needs.vmtests.result }}
          PRODUCTION_STANDARD: ${{ needs.qualification-standard.result }}
          PRODUCTION_LTS: ${{ needs.qualification-lts.result }}
          QUALIFIED: ${{ needs.qualified-bytes.result }}
        run: |
          test "$UNIT" = success
          test "$BUNDLE" = success
          test "$REGRESSION" = success
          test "$PRODUCTION_STANDARD" = success
          test "$PRODUCTION_LTS" = success
          test "$QUALIFIED" = success
