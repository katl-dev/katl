name: Katl Release Artifacts

on:
  # The nightly candidate on main runs the release path at a development version
  # above the pinned upgrade baseline. It restores shared build caches and publishes nothing.
  schedule:
    - cron: '17 3 * * *'
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: CalVer embedded in artifacts (for example 2026.7.0-beta.1); ignored when requalifying
        type: string
        required: true
      qualify_run:
        description: Requalify a final bundle from this run without rebuilding; zero builds a new candidate
        type: number
        default: 0
  # The release workflow calls this one to build and qualify a version it
  # derived, and publishes the result itself; the called path publishes
  # nothing. The publication jobs below stay skipped, but GitHub checks every
  # job's permissions against the caller's grant before any job starts, so the
  # calling job grants actions: read, attestations: write, contents: write,
  # id-token: write and packages: write. The called path builds github.sha:
  # commit must name it, and the caller tags that commit. It uploads its
  # artifacts under the katl- prefix into the caller's run, so the caller makes
  # one call per run and uploads no artifact of its own under that prefix.
  workflow_call:
    inputs:
      version:
        description: Version the caller derived (<version> or <version>-rc.N)
        type: string
        required: true
      commit:
        description: Full SHA of the commit to build; must equal github.sha
        type: string
        required: true
    outputs:
      artifact:
        description: Name of the bundle artifact in the caller's run
        value: ${{ jobs.identity.outputs.artifact-name }}
      sha256sums:
        description: SHA-256 digest of the bundle's SHA256SUMS
        value: ${{ jobs.bundle.outputs.sha256sums }}
      validation:
        description: Outcome of Release validation (success or failure)
        value: ${{ jobs.release-validation.outputs.result }}

permissions:
  contents: read
  actions: read

# Tag pushes queue per ref so publication is serialised and never
# cancelled. Dispatches publish nothing, so each gets its own group. The
# nightly candidate has a group of its own, so it never queues behind or ahead
# of a tag or a dispatch. A called run's github context is its caller's, so it
# takes a group of its own per run, suffixed so it never equals the caller's.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.commit && github.run_id || github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}${{ inputs.commit && '-call' || '' }}
  cancel-in-progress: false

jobs:
  existing-bundle:
    name: Resolve Existing Bundle
    if: inputs.qualify_run > 0
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ steps.bundle.outputs.artifact }}
      previous-tag: ${{ steps.bundle.outputs.previous-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.qualify_run }}
        run: |
          source="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          [[ "$(jq -r .path <<< "$source")" == .github/workflows/release-artifacts.yml ]]
          commit="$(jq -r .head_sha <<< "$source")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          bundles="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" | jq -s '[.[].artifacts[] | select(.name | test("^katl-[0-9]{4}[.][0-9]+[.][0-9]+(-[a-z0-9.-]+)?-x86_64-[0-9a-f]{12}$"))]')"
          jq -e 'length == 1 and .[0].expired == false' <<< "$bundles"
          artifact="$(jq -r '.[0].name' <<< "$bundles")"
          [[ "$artifact" == *-"${commit:0:12}" ]]
          tag="$(scripts/katl-release-artifacts upgrade-baseline "$commit")"
          {
            echo "artifact=$artifact"
            echo "previous-tag=$tag"
          } >> "$GITHUB_OUTPUT"

  requalify:
    name: Requalify production VM (${{ matrix.flavour }})
    needs: existing-bundle
    strategy:
      fail-fast: false
      matrix:
        flavour: [standard, lts]
    uses: ./.github/workflows/production-vmtests.yml
    with:
      flavour: ${{ matrix.flavour }}
      artifact-name: ${{ needs.existing-bundle.outputs.artifact }}
      run-id: ${{ fromJSON(inputs.qualify_run || '0') }}
      previous-tag: ${{ needs.existing-bundle.outputs.previous-tag }}

  unit:
    name: Release unit tests
    if: inputs.qualify_run == 0
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Set up tools
        uses: ./.github/actions/setup-tools
        timeout-minutes: 10
      - name: Allow Bubblewrap user namespaces
        timeout-minutes: 2
        run: nix develop --option builders '' .#ci -c .github/scripts/hosted-hermetic-setup
      - name: Run fast checks
        timeout-minutes: 12
        run: nix develop --option builders '' .#ci -c scripts/check-fast

  # Release candidates and final releases repeat the regression lanes only when
  # CI has not already passed them at this commit (scripts/katl-release
  # regression). Production build and qualification always run, because the
  # bytes embed the release version.
  vmtests:
    name: VM regression
    needs: identity
    if: inputs.qualify_run == 0 && needs.identity.outputs.regression != 'skip'
    strategy:
      fail-fast: false
      matrix:
        flavour: [standard, lts]
    uses: ./.github/workflows/hosted-vmtests.yml
    with:
      flavour: ${{ matrix.flavour }}

  identity:
    name: Resolve Release Identity
    if: inputs.qualify_run == 0
    runs-on: ubuntu-24.04
    outputs:
      artifact-name: ${{ steps.release.outputs.artifact-name }}
      version: ${{ steps.release.outputs.version }}
      previous-tag: ${{ steps.previous.outputs.tag }}
      regression: ${{ steps.regression.outputs.decision }}

    env:
      KATL_ARCHITECTURE: x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve supported upgrade source
        id: previous
        run: |
          tag="$(scripts/katl-release-artifacts upgrade-baseline)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Resolve release identity
        id: release
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          CALLED_COMMIT: ${{ inputs.commit }}
        run: |
          event="$GITHUB_EVENT_NAME"
          # A called run reports its caller's event; the caller supplies the version.
          if [[ -n "${CALLED_COMMIT:-}" ]]; then
            if [[ "$CALLED_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "::error::called to build $CALLED_COMMIT, but this run builds $GITHUB_SHA"
              exit 1
            fi
            event=workflow_call
          fi
          if [[ "$event" == schedule ]]; then
            MANUAL_VERSION="$(scripts/katl-release-artifacts dev-version "$PREVIOUS_TAG")"
          fi
          version="$(scripts/katl-release-artifacts version \
            "$event" "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" \
            "$MANUAL_VERSION")"
          short_sha="${GITHUB_SHA:0:12}"
          artifact_name="katl-${version}-${KATL_ARCHITECTURE}-${short_sha}"
          {
            echo "version=$version"
            echo "artifact-name=$artifact_name"
          } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-go
      # Only tag pushes may skip the regression lanes; scheduled, dispatched and
      # called runs always repeat them, because an empty decision runs the lanes. A final
      # tag fails here unless a release candidate of it already
      # succeeded at this commit.
      - name: Decide VM regression
        if: github.event_name == 'push' && github.ref_type == 'tag' && !inputs.commit
        id: regression
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          decision="$(scripts/katl-release regression "$VERSION" "$GITHUB_SHA")"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "VM regression: $decision" >> "$GITHUB_STEP_SUMMARY"

  build-standard:
    name: Build standard
    needs: identity
    permissions:
      contents: read
    uses: ./.github/workflows/production-build.yml
    with:
      flavour: standard
      version: ${{ needs.identity.outputs.version }}
      publication: true

  build-lts:
    name: Build lts
    needs: identity
    permissions:
      contents: read
    uses: ./.github/workflows/production-build.yml
    with:
      flavour: lts
      version: ${{ needs.identity.outputs.version }}
      publication: true

  bundle:
    name: Bundle Kernel Flavours
    needs: [identity, build-standard, build-lts]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      sha256sums: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/combine-flavours
      - name: Attest staged release artifacts
        if: github.event_name == 'push' && github.ref_type == 'tag' || inputs.commit
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Digest release checksums
        id: digest
        if: inputs.commit
        run: |
          digest="$(sha256sum dist/SHA256SUMS)"
          echo "sha256=${digest%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.identity.outputs.artifact-name }}
          path: dist/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'schedule' && 7 || 30 }}
          compression-level: 0


  qualification-standard:
    name: Production VM (standard)
    needs: [identity, build-standard]
    uses: ./.github/workflows/production-vmtests.yml
    with:
      flavour: standard
      artifact-name: ${{ needs.build-standard.outputs.artifact }}
      previous-tag: ${{ needs.identity.outputs.previous-tag }}

  qualification-lts:
    name: Production VM (lts)
    needs: [identity, build-lts]
    uses: ./.github/workflows/production-vmtests.yml
    with:
      flavour: lts
      artifact-name: ${{ needs.build-lts.outputs.artifact }}
      previous-tag: ${{ needs.identity.outputs.previous-tag }}

  qualified-bytes:
    name: Verify Qualified Bytes
    needs: [identity, bundle, qualification-standard, qualification-lts]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.identity.outputs.artifact-name }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: katl-qualified-*-${{ github.sha }}
          path: evidence
      - run: |
          scripts/katl-release equivalent dist \
            "standard=evidence/katl-qualified-standard-$GITHUB_SHA/SHA256SUMS" \
            "lts=evidence/katl-qualified-lts-$GITHUB_SHA/SHA256SUMS"

  release-validation:
    name: Release validation
    if: always() && inputs.qualify_run == 0
    needs:
      - identity
      - bundle
      - vmtests
      - qualification-standard
      - qualification-lts
      - qualified-bytes
      - unit
    runs-on: ubuntu-24.04
    outputs:
      result: ${{ steps.verdict.outcome }}
    steps:
      - id: verdict
        env:
          UNIT: ${{ needs.unit.result }}
          REGRESSION_DECISION: ${{ needs.identity.outputs.regression }}
          BUNDLE: ${{ needs.bundle.result }}
          REGRESSION: ${{ needs.vmtests.result }}
          PRODUCTION_STANDARD: ${{ needs.qualification-standard.result }}
          PRODUCTION_LTS: ${{ needs.qualification-lts.result }}
          QUALIFIED: ${{ needs.qualified-bytes.result }}
        run: |
          test "$UNIT" = success
          test "$BUNDLE" = success
          # The lanes may be skipped only when the identity job established that CI passed them.
          if [[ "$REGRESSION_DECISION" == skip ]]; then
            test "$REGRESSION" = skipped
          else
            test "$REGRESSION" = success
          fi
          test "$PRODUCTION_STANDARD" = success
          test "$PRODUCTION_LTS" = success
          test "$QUALIFIED" = success

  publish-extensions:
    name: Publish Kernel Extensions
    if: github.event_name == 'push' && github.ref_type == 'tag' && !inputs.commit
    needs: [build-standard, build-lts, release-validation]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: actions/download-artifact@v8
        with:
          pattern: katl-extension-bundles-*-${{ github.sha }}
          path: artifacts
      - name: Authenticate publication
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish the verified OCI bytes without rebuilding
        shell: bash
        run: |
          for flavour in standard lts; do
            directory="artifacts/katl-extension-bundles-${flavour}-${GITHUB_SHA}"
            go run ./cmd/katl-mkosi-artifacts publish-release-extensions \
              "$directory/release-extensions.json" "$directory/extension-bundles"
          done

  publish-tag:
    name: Publish GitHub Release Assets
    if: github.event_name == 'push' && github.ref_type == 'tag' && !inputs.commit
    needs:
      - identity
      - bundle
      - publish-extensions
    runs-on: ubuntu-24.04
    permissions:
      attestations: read
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Download verified artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.identity.outputs.artifact-name }}
          path: dist

      - name: Verify release checksums and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/katl-release verify "$GITHUB_REF_NAME" "$GITHUB_SHA" dist

      - name: Publish tag release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KATL_VERSION: ${{ needs.identity.outputs.version }}
        run: |
          prerelease=()
          if [[ "$KATL_VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          if gh release view --repo "$GITHUB_REPOSITORY" \
            "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A re-run rebuilds the tag, and a rebuild is not byte-identical, so
            # replacing the assets of a published release would silently change
            # what operators already downloaded. Only a release whose checksums
            # match, or one an earlier failed upload left without any, is
            # completed in place.
            published_sums=$(gh release view --repo "$GITHUB_REPOSITORY" \
              "$GITHUB_REF_NAME" --json assets \
              --jq '[.assets[].name] | index("SHA256SUMS") != null')
            if [[ "$published_sums" == true ]]; then
              sums_dir=$(mktemp -d)
              gh release download --repo "$GITHUB_REPOSITORY" \
                "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir "$sums_dir"
              if ! cmp -s "$sums_dir/SHA256SUMS" dist/SHA256SUMS; then
                echo "::error::release $GITHUB_REF_NAME is already published with different contents; cut a new tag instead of re-running this one"
                exit 1
              fi
            fi
            gh release upload --repo "$GITHUB_REPOSITORY" \
              --clobber "$GITHUB_REF_NAME" dist/*
          else
            gh release create --repo "$GITHUB_REPOSITORY" \
              "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "KatlOS $KATL_VERSION" \
              --notes-file dist/RELEASE_NOTES.md \
              "${prerelease[@]}" \
              dist/*
          fi
