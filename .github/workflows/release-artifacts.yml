name: Katl Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: CalVer embedded in artifacts (for example 2026.7.0-beta.1); ignored when requalifying
        type: string
        required: true
      qualify_run:
        description: Requalify a final bundle from this run without rebuilding; zero builds a new candidate
        type: number
        default: 0

permissions:
  contents: read
  actions: read

# Tag pushes queue per ref so publication is serialised and never
# cancelled. Dispatches publish nothing, so each gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  existing-bundle:
    name: Resolve Existing Bundle
    if: inputs.qualify_run > 0
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ steps.bundle.outputs.artifact }}
      previous-tag: ${{ steps.bundle.outputs.previous-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.qualify_run }}
        run: |
          source="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          [[ "$(jq -r .path <<< "$source")" == .github/workflows/release-artifacts.yml ]]
          commit="$(jq -r .head_sha <<< "$source")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          bundles="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" | jq -s '[.[].artifacts[] | select(.name | test("^katl-[0-9]{4}[.][0-9]+[.][0-9]+(-[a-z0-9.-]+)?-x86_64-[0-9a-f]{12}$"))]')"
          jq -e 'length == 1 and .[0].expired == false' <<< "$bundles"
          artifact="$(jq -r '.[0].name' <<< "$bundles")"
          [[ "$artifact" == *-"${commit:0:12}" ]]
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "previous-tag=$(scripts/katl-release-artifacts previous-tag)" >> "$GITHUB_OUTPUT"

  requalify:
    name: Requalify production VM (${{ matrix.flavour }})
    needs: existing-bundle
    strategy:
      fail-fast: false
      matrix:
        flavour: [standard, lts]
    uses: ./.github/workflows/production-vmtests.yml
    with:
      flavour: ${{ matrix.flavour }}
      artifact-name: ${{ needs.existing-bundle.outputs.artifact }}
      run-id: ${{ fromJSON(inputs.qualify_run || '0') }}
      previous-tag: ${{ needs.existing-bundle.outputs.previous-tag }}

  unit:
    name: Release unit tests
    if: inputs.qualify_run == 0
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: .github/scripts/hosted-apt-install dosfstools mtools xorriso squashfs-tools
      - run: scripts/check-fast

  vmtests:
    name: VM regression
    if: inputs.qualify_run == 0
    strategy:
      fail-fast: false
      matrix:
        flavour: [standard, lts]
    uses: ./.github/workflows/hosted-vmtests.yml
    with:
      flavour: ${{ matrix.flavour }}

  identity:
    name: Resolve Release Identity
    if: inputs.qualify_run == 0
    runs-on: ubuntu-24.04
    outputs:
      artifact-name: ${{ steps.release.outputs.artifact-name }}
      version: ${{ steps.release.outputs.version }}
      previous-tag: ${{ steps.previous.outputs.tag }}

    env:
      KATL_ARCHITECTURE: x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve release identity
        id: release
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          event="$GITHUB_EVENT_NAME"
          version="$(scripts/katl-release-artifacts version \
            "$event" "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" \
            "$MANUAL_VERSION")"
          short_sha="${GITHUB_SHA:0:12}"
          artifact_name="katl-${version}-${KATL_ARCHITECTURE}-${short_sha}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Resolve supported upgrade source
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(scripts/katl-release-artifacts previous-tag)" >> "$GITHUB_OUTPUT"

  build-standard:
    name: Build standard
    needs: identity
    permissions:
      contents: read
    uses: ./.github/workflows/production-build.yml
    with:
      flavour: standard
      version: ${{ needs.identity.outputs.version }}
      previous-tag: ${{ needs.identity.outputs.previous-tag }}
      publication: true

  build-lts:
    name: Build lts
    needs: identity
    permissions:
      contents: read
    uses: ./.github/workflows/production-build.yml
    with:
      flavour: lts
      version: ${{ needs.identity.outputs.version }}
      previous-tag: ${{ needs.identity.outputs.previous-tag }}
      publication: true

  bundle:
    name: Bundle Kernel Flavours
    needs: [identity, build-standard, build-lts]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/combine-flavours
      - name: Attest staged release artifacts
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.identity.outputs.artifact-name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0


  qualification-standard:
    name: Production VM (standard)
    needs: [identity, build-standard]
    uses: ./.github/workflows/production-vmtests.yml
    with:
      flavour: standard
      artifact-name: ${{ needs.build-standard.outputs.artifact }}
      previous-tag: ${{ needs.identity.outputs.previous-tag }}

  qualification-lts:
    name: Production VM (lts)
    needs: [identity, build-lts]
    uses: ./.github/workflows/production-vmtests.yml
    with:
      flavour: lts
      artifact-name: ${{ needs.build-lts.outputs.artifact }}
      previous-tag: ${{ needs.identity.outputs.previous-tag }}

  qualified-bytes:
    name: Verify Qualified Bytes
    needs: [identity, bundle, qualification-standard, qualification-lts]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.identity.outputs.artifact-name }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: katl-qualified-*-${{ github.sha }}
          path: evidence
      - run: |
          scripts/katl-release equivalent dist \
            "standard=evidence/katl-qualified-standard-$GITHUB_SHA/SHA256SUMS" \
            "lts=evidence/katl-qualified-lts-$GITHUB_SHA/SHA256SUMS"

  release-validation:
    name: Release validation
    if: always() && inputs.qualify_run == 0
    needs:
      - bundle
      - vmtests
      - qualification-standard
      - qualification-lts
      - qualified-bytes
      - unit
    runs-on: ubuntu-24.04
    steps:
      - env:
          UNIT: ${{ needs.unit.result }}
          BUNDLE: ${{ needs.bundle.result }}
          REGRESSION: ${{ needs.vmtests.result }}
          PRODUCTION_STANDARD: ${{ needs.qualification-standard.result }}
          PRODUCTION_LTS: ${{ needs.qualification-lts.result }}
          QUALIFIED: ${{ needs.qualified-bytes.result }}
        run: |
          test "$UNIT" = success
          test "$BUNDLE" = success
          test "$REGRESSION" = success
          test "$PRODUCTION_STANDARD" = success
          test "$PRODUCTION_LTS" = success
          test "$QUALIFIED" = success

  publish-extensions:
    name: Publish Kernel Extensions
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build-standard, build-lts, release-validation]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: katl-extension-bundles-*-${{ github.sha }}
          path: artifacts
      - name: Authenticate publication
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish the verified OCI bytes without rebuilding
        shell: bash
        run: |
          for flavour in standard lts; do
            directory="artifacts/katl-extension-bundles-${flavour}-${GITHUB_SHA}"
            go run ./cmd/katl-mkosi-artifacts publish-release-extensions \
              "$directory/release-extensions.json" "$directory/extension-bundles"
          done

  publish-tag:
    name: Publish GitHub Release Assets
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - identity
      - bundle
      - publish-extensions
    runs-on: ubuntu-24.04
    permissions:
      attestations: read
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download verified artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.identity.outputs.artifact-name }}
          path: dist

      - name: Verify release checksums and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/katl-release verify "$GITHUB_REF_NAME" "$GITHUB_SHA" dist

      - name: Publish tag release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KATL_VERSION: ${{ needs.identity.outputs.version }}
        run: |
          prerelease=()
          if [[ "$KATL_VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          if gh release view --repo "$GITHUB_REPOSITORY" \
            "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A re-run rebuilds the tag, and a rebuild is not byte-identical, so
            # replacing the assets of a published release would silently change
            # what operators already downloaded. Only a release whose checksums
            # match, or one an earlier failed upload left without any, is
            # completed in place.
            published_sums=$(gh release view --repo "$GITHUB_REPOSITORY" \
              "$GITHUB_REF_NAME" --json assets \
              --jq '[.assets[].name] | index("SHA256SUMS") != null')
            if [[ "$published_sums" == true ]]; then
              sums_dir=$(mktemp -d)
              gh release download --repo "$GITHUB_REPOSITORY" \
                "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir "$sums_dir"
              if ! cmp -s "$sums_dir/SHA256SUMS" dist/SHA256SUMS; then
                echo "::error::release $GITHUB_REF_NAME is already published with different contents; cut a new tag instead of re-running this one"
                exit 1
              fi
            fi
            gh release upload --repo "$GITHUB_REPOSITORY" \
              --clobber "$GITHUB_REF_NAME" dist/*
          else
            gh release create --repo "$GITHUB_REPOSITORY" \
              "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "KatlOS $KATL_VERSION" \
              --notes-file dist/RELEASE_NOTES.md \
              "${prerelease[@]}" \
              dist/*
          fi
