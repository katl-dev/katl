name: System Extension Bundles

on:
  pull_request:
    paths:
      - .github/workflows/system-extensions.yml
      - Containerfile.mkosi
      - mkosi-builder.lock
      - mkosi.conf
      - cmd/katlctl/system_extension.go
      - extensions/**
      - mkosi.profiles/runtime/**
      - mkosi.profiles/system-extension-*/**
      - internal/installer/payloadbundle/**
      - internal/installer/systemextensionbundle/**
      - internal/systemdunit/units/**
      - scripts/build-system-extension
      - scripts/check-system-extension
      - cmd/katl-mkosi-artifacts/extract_sysext.go
      - internal/sysextimage/**
      - scripts/fedora-release
      - scripts/mkosi
      - scripts/mkosi-builder
      - scripts/retry
  push:
    branches: [main]
    paths:
      - .github/workflows/system-extensions.yml
      - Containerfile.mkosi
      - mkosi-builder.lock
      - mkosi.conf
      - cmd/katlctl/system_extension.go
      - extensions/**
      - mkosi.profiles/runtime/**
      - mkosi.profiles/system-extension-*/**
      - internal/installer/payloadbundle/**
      - internal/installer/systemextensionbundle/**
      - internal/systemdunit/units/**
      - scripts/build-system-extension
      - scripts/check-system-extension
      - cmd/katl-mkosi-artifacts/extract_sysext.go
      - internal/sysextimage/**
      - scripts/fedora-release
      - scripts/mkosi
      - scripts/mkosi-builder
      - scripts/retry
  workflow_dispatch:
    inputs:
      name:
        description: Extension definition name
        required: true
        default: bird
        type: string
      publish:
        description: Publish the immutable OCI bundle
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  bird:
    if: ${{ inputs.name == '' || inputs.name == 'bird' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.publication.outputs.publish }}
    env:
      KATL_BIRD_RECIPE_PATTERN: '^(Containerfile\.mkosi$|extensions/bird/|internal/systemdunit/units/|mkosi\.conf$|mkosi\.profiles/runtime/|mkosi\.profiles/system-extension-bird/|scripts/build-system-extension$|scripts/fedora-release$|scripts/mkosi$)'
      KATL_ARCHITECTURE: x86_64
      KATL_CONTAINER_RUNTIME: docker
      KATL_MKOSI_IMAGE: localhost/katl-mkosi-builder:go-squashfs
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        timeout-minutes: 10
      - name: Require a new extension version for changed build inputs
        timeout-minutes: 3
        id: revision
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        # HEAD is the pull request's merge commit. Its first parent is the
        # base it merges into, so changes on main since the branch point are
        # not counted as the pull request's.
        run: go run ./cmd/katl-vmtest-plan extensions --base-ref "$BASE_REF" --base HEAD^1 --head HEAD
      - name: Set reproducible inputs
        timeout-minutes: 3
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
          echo "KATL_BUILD_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Determine immutable publication intent
        timeout-minutes: 3
        id: publication
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish || false }}
        run: |
          publish=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_PUBLISH" == "true" ]]; then
            publish=true
          elif [[ "$EVENT_NAME" == "push" ]]; then
            changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -Ev '_test\.go$' || true)"
            if grep -Eq "$KATL_BIRD_RECIPE_PATTERN" <<<"$changed"; then
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Build and verify generic BIRD extension
        timeout-minutes: 30
        shell: bash
        run: |
          scripts/mkosi build-runtime
          scripts/build-system-extension bird
          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --env KATL_REPO_ROOT=/work \
            "$KATL_MKOSI_IMAGE" \
            scripts/check-system-extension bird
          source extensions/bird/extension.env
          created_at="$(date --utc --date="@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"
          go run ./cmd/katlctl system-extension publish \
            --pack-only \
            --name "$KATL_EXTENSION_NAME" \
            --artifact-version "$KATL_EXTENSION_ARTIFACT_VERSION" \
            --payload-version "$KATL_EXTENSION_PAYLOAD_VERSION" \
            --architecture "$KATL_ARCHITECTURE" \
            --runtime-interface "$KATL_EXTENSION_RUNTIME_INTERFACE" \
            --created-at "$created_at" \
            --sysext "_build/mkosi/katl-bird.raw"
      - uses: actions/upload-artifact@v7
        timeout-minutes: 10
        if: ${{ steps.publication.outputs.publish == 'true' }}
        with:
          name: katl-bird-extension-${{ github.sha }}
          path: _build/mkosi/katl-bird.raw
          if-no-files-found: error
          retention-days: 1

  publish-bird:
    needs: bird
    if: ${{ needs.bird.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read # hosted-download reads the build's artifact.
      packages: write
    env:
      KATL_ARCHITECTURE: x86_64
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        timeout-minutes: 10
      - name: Download the BIRD extension
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          KATL_DOWNLOAD_ATTEMPT_SECONDS: 60
          EXTENSION: katl-bird-extension-${{ github.sha }}
        run: .github/scripts/hosted-download artifact "$EXTENSION" _build/mkosi
      - name: Log in to GHCR
        timeout-minutes: 5
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish through the common payload-bundle publisher
        timeout-minutes: 10
        shell: bash
        run: |
          source extensions/bird/extension.env
          created_at="$(date --utc --date="@$(git show -s --format=%ct "$GITHUB_SHA")" +%Y-%m-%dT%H:%M:%SZ)"
          go run ./cmd/katlctl system-extension publish \
            --ref "ghcr.io/katl-dev/katl/extensions/bird:${KATL_EXTENSION_ARTIFACT_VERSION}" \
            --name "$KATL_EXTENSION_NAME" \
            --artifact-version "$KATL_EXTENSION_ARTIFACT_VERSION" \
            --payload-version "$KATL_EXTENSION_PAYLOAD_VERSION" \
            --architecture "$KATL_ARCHITECTURE" \
            --runtime-interface "$KATL_EXTENSION_RUNTIME_INTERFACE" \
            --created-at "$created_at" \
            --sysext "_build/mkosi/katl-bird.raw"
