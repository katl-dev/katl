name: System Extension Bundles

on:
  pull_request:
    paths:
      - .github/workflows/system-extensions.yml
      - Containerfile.mkosi
      - mkosi.conf
      - mkosi.conf.d/**
      - mkosi.extra/**
      - cmd/katlctl/system_extension.go
      - extensions/**
      - mkosi.profiles/runtime/**
      - mkosi.profiles/system-extension-*/**
      - internal/installer/payloadbundle/**
      - internal/installer/systemextensionbundle/**
      - kernels/**
      - packages/**
      - scripts/build-system-extension
      - scripts/check-system-extension
      - scripts/ci-bird-extension
      - scripts/fedora-release
      - scripts/mkosi
  push:
    branches: [main]
    paths:
      - .github/workflows/system-extensions.yml
      - Containerfile.mkosi
      - mkosi.conf
      - mkosi.conf.d/**
      - mkosi.extra/**
      - cmd/katlctl/system_extension.go
      - extensions/**
      - mkosi.profiles/runtime/**
      - mkosi.profiles/system-extension-*/**
      - internal/installer/payloadbundle/**
      - internal/installer/systemextensionbundle/**
      - kernels/**
      - packages/**
      - scripts/build-system-extension
      - scripts/check-system-extension
      - scripts/ci-bird-extension
      - scripts/fedora-release
      - scripts/mkosi
  workflow_dispatch:
    inputs:
      name:
        description: Extension definition name
        required: true
        default: bird
        type: string
      publish:
        description: Publish the immutable OCI bundle
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  bird:
    if: ${{ inputs.name == '' || inputs.name == 'bird' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.publication.outputs.publish }}
    env:
      KATL_ARCHITECTURE: x86_64
      KATL_CONTAINER_RUNTIME: docker
      KATL_MKOSI_IMAGE: localhost/katl-mkosi-builder:go-squashfs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Set reproducible inputs
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
          echo "KATL_BUILD_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Determine immutable publication intent
        id: publication
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish || false }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          publish=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_PUBLISH" == "true" ]]; then
            publish=true
          elif [[ "$EVENT_NAME" == "push" ]]; then
            previous_version="$(scripts/ci-bird-extension version "$BEFORE_SHA")"
            version="$(scripts/ci-bird-extension version "$GITHUB_SHA")"
            if [[ "$previous_version" != "$version" ]]; then
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Build and verify the BIRD extension and its immutable revision
        id: revision
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        # A push compares against the previous main, so a change merged under
        # an artifact version that main already published fails instead of
        # going unpublished.
        run: scripts/ci-bird-extension build "${PR_BASE_SHA:-$BEFORE_SHA}"
      - uses: actions/upload-artifact@v7
        if: ${{ steps.publication.outputs.publish == 'true' }}
        with:
          name: katl-bird-extension-${{ github.sha }}
          path: _build/mkosi/katl-bird.raw
          if-no-files-found: error
          retention-days: 1

  publish-bird:
    needs: bird
    if: ${{ needs.bird.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      KATL_ARCHITECTURE: x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: actions/download-artifact@v8
        with:
          name: katl-bird-extension-${{ github.sha }}
          path: _build/mkosi
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish through the common payload-bundle publisher
        shell: bash
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH
          scripts/ci-bird-extension publish
