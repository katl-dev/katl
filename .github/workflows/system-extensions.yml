name: System Extension Bundles

on:
  pull_request:
    paths:
      - .github/workflows/system-extensions.yml
      - Containerfile.mkosi
      - cmd/katlctl/system_extension.go
      - extensions/**
      - mkosi.profiles/system-extension-*/**
      - internal/installer/payloadbundle/**
      - internal/installer/systemextensionbundle/**
      - scripts/build-system-extension
      - scripts/check-system-extension
      - scripts/mkosi
  push:
    branches: [main]
    paths:
      - .github/workflows/system-extensions.yml
      - Containerfile.mkosi
      - cmd/katlctl/system_extension.go
      - extensions/**
      - mkosi.profiles/system-extension-*/**
      - internal/installer/payloadbundle/**
      - internal/installer/systemextensionbundle/**
      - scripts/build-system-extension
      - scripts/check-system-extension
      - scripts/mkosi
  workflow_dispatch:
    inputs:
      name:
        description: Extension definition name
        required: true
        default: bird
        type: string
      publish:
        description: Publish the immutable OCI bundle
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  bird:
    if: ${{ inputs.name == '' || inputs.name == 'bird' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      KATL_BIRD_RECIPE_PATTERN: '^(\.github/workflows/system-extensions\.yml$|Containerfile\.mkosi$|cmd/katlctl/system_extension\.go$|extensions/bird/extension\.env$|internal/installer/payloadbundle/|internal/installer/systemextensionbundle/|mkosi\.conf$|mkosi\.profiles/runtime/|mkosi\.profiles/system-extension-bird/|scripts/build-system-extension$|scripts/check-system-extension$|scripts/mkosi$)'
      KATL_ARCHITECTURE: x86_64
      KATL_CONTAINER_RUNTIME: docker
      KATL_MKOSI_IMAGE: localhost/katl-mkosi-builder:fedora-44-go-squashfs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Require an immutable revision for recipe changes
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD | grep -Ev '_test\.go$' || true)"
          if ! grep -Eq "$KATL_BIRD_RECIPE_PATTERN" <<<"$changed"; then
            exit 0
          fi
          previous_version="$(git show "$BASE_SHA:extensions/bird/extension.env" | sed -n 's/^KATL_EXTENSION_ARTIFACT_VERSION=//p')"
          source extensions/bird/extension.env
          if [[ "$KATL_EXTENSION_ARTIFACT_VERSION" == "$previous_version" ]]; then
            echo "error: BIRD extension recipe changed without advancing KATL_EXTENSION_ARTIFACT_VERSION" >&2
            exit 1
          fi
      - name: Set reproducible inputs
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
          echo "KATL_BUILD_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Determine immutable publication intent
        id: publication
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish || false }}
        run: |
          publish=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_PUBLISH" == "true" ]]; then
            publish=true
          elif [[ "$EVENT_NAME" == "push" ]]; then
            changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -Ev '_test\.go$' || true)"
            if grep -Eq "$KATL_BIRD_RECIPE_PATTERN" <<<"$changed"; then
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Build and verify generic BIRD extension
        shell: bash
        run: |
          scripts/mkosi build-runtime
          scripts/build-system-extension bird
          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --env KATL_REPO_ROOT=/work \
            "$KATL_MKOSI_IMAGE" \
            scripts/check-system-extension bird
          source extensions/bird/extension.env
          created_at="$(date --utc --date="@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"
          go run ./cmd/katlctl system-extension publish \
            --pack-only \
            --name "$KATL_EXTENSION_NAME" \
            --artifact-version "$KATL_EXTENSION_ARTIFACT_VERSION" \
            --payload-version "$KATL_EXTENSION_PAYLOAD_VERSION" \
            --architecture "$KATL_ARCHITECTURE" \
            --runtime-interface "$KATL_EXTENSION_RUNTIME_INTERFACE" \
            --created-at "$created_at" \
            --sysext "_build/mkosi/katl-bird.raw"
      - name: Log in to GHCR
        if: ${{ steps.publication.outputs.publish == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish through the common payload-bundle publisher
        if: ${{ steps.publication.outputs.publish == 'true' }}
        shell: bash
        run: |
          source extensions/bird/extension.env
          created_at="$(date --utc --date="@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"
          go run ./cmd/katlctl system-extension publish \
            --ref "ghcr.io/katl-dev/katl/extensions/bird:${KATL_EXTENSION_ARTIFACT_VERSION}" \
            --name "$KATL_EXTENSION_NAME" \
            --artifact-version "$KATL_EXTENSION_ARTIFACT_VERSION" \
            --payload-version "$KATL_EXTENSION_PAYLOAD_VERSION" \
            --architecture "$KATL_ARCHITECTURE" \
            --runtime-interface "$KATL_EXTENSION_RUNTIME_INTERFACE" \
            --created-at "$created_at" \
            --sysext "_build/mkosi/katl-bird.raw"
