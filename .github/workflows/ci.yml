name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches: [main, 'release/[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

# Label and edit events do not trigger this workflow, because a cancelled or
# skipped run would publish a CI result for the head SHA. vmtest-label.yml reruns
# the pull request's run when vmtest is added.
#
# The result job is named after the base its payload tested: CI for every event
# except a pull request into a release branch, which publishes "CI (release)".
# A rerun replays the payload and so keeps its name, and the release ruleset
# requires only "CI (release)". A pull request retargeted onto a release branch
# therefore lacks that check until it is reopened or receives a commit.
#
# Only a newer push to the same pull request supersedes a run. Merge-group
# entries have unique refs, and every other trigger (push, dispatch) is
# independent, so two dispatches on one ref both complete.
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'merge_group' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    outputs:
      vm-flavours: ${{ steps.plan.outputs.vm-flavours }}
      driver-flavours: ${{ steps.plan.outputs.driver-flavours }}
      production-flavours: ${{ steps.plan.outputs.production-flavours }}
      production-version: ${{ steps.production.outputs.version }}
      production-previous-tag: ${{ steps.production.outputs.previous-tag }}
      kubernetes-version: ${{ steps.plan.outputs.kubernetes-version }}
      scenarios: ${{ steps.plan.outputs.scenarios }}
      range: ${{ steps.plan.outputs.range }}
      full-plan: ${{ steps.plan.outputs.full-plan }}
      check-suffix: ${{ steps.plan.outputs.check-suffix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Read the labels and base now rather than from the event payload, which a
      # rerun repeats unchanged. A run whose payload base is stale fails below
      # rather than plan for a base it did not test.
      - name: Read pull request state
        id: pr
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels,baseRefName --jq '
            "vmtest=\(any(.labels[]; .name == "vmtest"))\nbase=\(.baseRefName)"' >> "$GITHUB_OUTPUT"
      # A rerun replays the payload and its merge commit, which was made with the
      # base at the time. If the pull request has been retargeted since, this run
      # tested the wrong base and must not pass for the new one.
      - name: Require the tested base
        if: github.event_name == 'pull_request'
        env:
          TESTED_BASE: ${{ github.base_ref }}
          LIVE_BASE: ${{ steps.pr.outputs.base }}
        run: |
          if [[ "$TESTED_BASE" != "$LIVE_BASE" ]]; then
            echo "::error::This run tested $TESTED_BASE but the pull request now targets $LIVE_BASE; close and reopen the pull request, or push a commit, to run CI against the new base."
            exit 1
          fi
      - name: Select validation
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ steps.pr.outputs.base }}
          PAYLOAD_BASE: ${{ github.base_ref }}
          VMTEST_LABEL: ${{ steps.pr.outputs.vmtest }}
        run: |
          mkdir -p _build
          options=(--ci)
          # Release series branches match the push filter, where * does not cross a slash.
          release_base() { [[ "$1" == release/[0-9]* && "$1" != release/*/* ]]; }
          # The full plan applies in the merge queue and on pull requests into a release
          # branch, which has no merge queue. The vmtest label adds the VM suites without
          # it, so a labelled pull request into main does not take full-plan decisions.
          # BASE_REF is read live, as the label is. Driver qualification runs wherever
          # the planner selects it, except on pushes.
          full_plan=false
          regression=false
          no_drivers=false
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              if release_base "${BASE_REF:-}"; then full_plan=true; fi
              if [[ "${VMTEST_LABEL:-false}" == true ]]; then regression=true; fi ;;
            merge_group) full_plan=true ;;
            push) no_drivers=true ;;
          esac
          if [[ "$full_plan" == true ]]; then regression=true; fi
          no_vms=false
          if [[ "$regression" == false && "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then no_vms=true; fi
          if [[ "$regression" == true ]]; then options+=(--regression); fi
          # The full plan also builds the production images, whatever the changed paths.
          production='[]'
          if [[ "$full_plan" == true ]]; then production='["standard","lts"]'; fi
          # The result job's name derives from the payload base, which a rerun replays,
          # so the required check names the base this run tested.
          check_suffix=
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] && release_base "${PAYLOAD_BASE:-}"; then check_suffix="(release)"; fi
          # BASE_SHA stays the payload value: a rerun checks out the same merge commit
          # as the payload describes, so the range matches the tree under test.
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == merge_group ]]; then
            base="$BASE_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            base="$BEFORE_SHA"
          else
            base="$(git hash-object -t tree /dev/null)"
          fi
          # Include deletions as well as additions when a file is renamed.
          git diff --name-only --no-renames -z "$base" HEAD > _build/ci-changes
          go run ./cmd/katl-vmtest-plan "${options[@]}" < _build/ci-changes > _build/ci-candidates.json
          jq -c --argjson noVMs "$no_vms" --argjson noDrivers "$no_drivers" '
            (if $noVMs then .vmFlavours = [] | .groups = [] else . end) |
            (if $noDrivers then .driverFlavours = [] else . end)
          ' _build/ci-candidates.json > _build/ci-plan.json
          go run ./cmd/katl-kubernetes-release presubmit --base "$base" > _build/kubernetes-plan.json
          {
            echo "vm-flavours=$(jq -c .vmFlavours _build/ci-plan.json)"
            echo "driver-flavours=$(jq -c .driverFlavours _build/ci-plan.json)"
            echo "production-flavours=$production"
            echo "scenarios=$(jq -c '{include: .groups}' _build/ci-plan.json)"
            echo "kubernetes-version=$(jq -r '.include[0].payloadVersion // empty' _build/kubernetes-plan.json)"
            echo "range=$base..HEAD"
            echo "full-plan=$full_plan"
            echo "check-suffix=$check_suffix"
          } >> "$GITHUB_OUTPUT"
          cat _build/ci-plan.json >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve production identity
        id: production
        if: steps.plan.outputs.production-flavours != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Production bytes carry a development version above the stable release
          # they upgrade from; nothing is published. The merge queue upgrades from
          # the latest stable release. A pull request into a release branch upgrades
          # from the latest stable tag in that branch's own series.
          tag="$(scripts/katl-release-artifacts previous-tag ${BASE_SHA:+"$BASE_SHA"})"
          echo "previous-tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$(scripts/katl-release-artifacts dev-version "$tag")" >> "$GITHUB_OUTPUT"

  checks:
    name: Fast checks
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: .github/scripts/hosted-apt-install dosfstools mtools xorriso squashfs-tools
      - name: Run fast checks
        env:
          COMPARISON: ${{ needs.plan.outputs.range }}
        run: scripts/check-fast "$COMPARISON"
      - name: Validate workflows
        # This actionlint release predates the App action's client-id input.
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          -shellcheck=
          -ignore 'input "(app-id|client-id)".*action "actions/create-github-app-token@v3"'

  nix:
    name: Nix katlctl
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
          enable_kvm: false
      - name: Build katlctl flake package
        run: nix build .#katlctl --out-link _build/katlctl --print-build-logs
      - name: Verify packaged CLI and completions
        run: |
          _build/katlctl/bin/katlctl --help
          test -s _build/katlctl/share/bash-completion/completions/katlctl.bash
          test -s _build/katlctl/share/fish/vendor_completions.d/katlctl.fish
          test -s _build/katlctl/share/zsh/site-functions/_katlctl

  vms:
    name: VM (${{ matrix.flavour }})
    needs: plan
    if: needs.plan.outputs.vm-flavours != '[]'
    strategy:
      fail-fast: false
      matrix:
        flavour: ${{ fromJSON(needs.plan.outputs.vm-flavours) }}
    uses: ./.github/workflows/hosted-vmtests.yml
    with:
      flavour: ${{ matrix.flavour }}
      kubernetes-version: ${{ needs.plan.outputs.kubernetes-version }}
      scenarios: ${{ needs.plan.outputs.scenarios }}

  drivers:
    name: Drivers (${{ matrix.flavour }})
    needs: plan
    if: needs.plan.outputs.driver-flavours != '[]'
    strategy:
      fail-fast: false
      matrix:
        flavour: ${{ fromJSON(needs.plan.outputs.driver-flavours) }}
    uses: ./.github/workflows/kernel-qualification.yml
    with:
      flavour: ${{ matrix.flavour }}

  production:
    name: Production (${{ matrix.flavour }})
    needs: plan
    if: needs.plan.outputs.production-flavours != '[]'
    strategy:
      fail-fast: false
      matrix:
        flavour: ${{ fromJSON(needs.plan.outputs.production-flavours) }}
    permissions:
      contents: read
    uses: ./.github/workflows/production-build.yml
    with:
      flavour: ${{ matrix.flavour }}
      version: ${{ needs.plan.outputs.production-version }}
      previous-tag: ${{ needs.plan.outputs.production-previous-tag }}
      publication: false

  bundle:
    name: Production bundle
    needs: [plan, production]
    if: needs.plan.outputs.production-flavours != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/combine-flavours

  result:
    name: CI${{ needs.plan.outputs.check-suffix && format(' {0}', needs.plan.outputs.check-suffix) || '' }}
    if: always()
    needs: [plan, checks, nix, vms, drivers, production, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require selected validation
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            .plan.result == "success" and .checks.result == "success" and .nix.result == "success" and
            ([{flavours: .plan.outputs["vm-flavours"], result: .vms.result},
              {flavours: .plan.outputs["driver-flavours"], result: .drivers.result},
              {flavours: .plan.outputs["production-flavours"], result: .production.result},
              {flavours: .plan.outputs["production-flavours"], result: .bundle.result}]
             | all(.[];
                 (.flavours | fromjson) as $flavours |
                 ($flavours | type == "array") and
                 (if ($flavours | length) > 0 then .result == "success"
                  else .result == "skipped" end)))
          ' <<< "$NEEDS"
