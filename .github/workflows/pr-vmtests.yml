name: VM presubmit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-presubmit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scenarios:
    name: Regression (${{ matrix.flavour }})
    strategy:
      fail-fast: false
      matrix:
        flavour: [standard, lts]
    uses: ./.github/workflows/hosted-vmtests.yml
    with:
      flavour: ${{ matrix.flavour }}

  result:
    name: VM presubmit
    if: always()
    needs: scenarios
    runs-on: ubuntu-24.04
    steps:
      - env:
          SCENARIOS: ${{ needs.scenarios.result }}
        run: '[[ "$SCENARIOS" == success ]]'
