name: Hosted VM scenarios

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted runner or katl-vmtest (main only); blank uses repository settings
        type: string
      flavour:
        description: Kernel flavour
        type: choice
        options: [standard, lts]
        default: standard
      ref:
        description: Source commit to qualify, which must provide the flake's ci shell; blank uses the workflow revision
        type: string
  workflow_call:
    inputs:
      runner:
        description: Hosted runner or katl-vmtest (main only); blank uses repository settings
        type: string
      flavour:
        type: string
        default: standard
      ref:
        type: string
      kubernetes-version:
        description: Validate this supported Kubernetes candidate in the shared image build
        type: string
      scenarios:
        description: Planned include matrix; empty runs the complete suite
        type: string

permissions:
  contents: read

# Evaluated in the caller's context when called, so github.workflow carries the
# caller's name and keeps this group distinct from the caller's own group.
# Same scoping policy as ci.yml: supersede only within a pull request.
concurrency:
  group: ${{ github.workflow }}-vmtests-${{ inputs.flavour || 'standard' }}-${{ github.event.pull_request.number || (github.event_name == 'merge_group' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KATL_FLAVOUR: ${{ inputs.flavour || 'standard' }}
  KATL_VMTEST_KVM: 'on'
  KATL_VMTEST_KEEP: failed
  KATL_VMTEST_DEBUG_ON_FAILURE: '0'
  KATL_OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
  KATL_OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
  KATL_VMTEST_GO: ${{ github.workspace }}/.github/scripts/hosted-vmtest-go

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      runner: ${{ steps.host.outputs.runner }}
      prepared: ${{ steps.host.outputs.prepared }}
      source: ${{ steps.host.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # An explicit source ref takes its actions from this workflow's revision.
      # The ci shell still comes from that ref, and setup-tools rejects a ref
      # that predates it.
      - uses: actions/checkout@v7
        timeout-minutes: 2
        if: inputs.scenarios == '' && inputs.ref != ''
        with:
          ref: ${{ github.workflow_sha }}
          path: _build/workflow-actions
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-tools
      - name: Set up tools from the workflow revision
        uses: ./_build/workflow-actions/.github/actions/setup-tools
        if: inputs.scenarios == '' && inputs.ref != ''
        timeout-minutes: 11
      - name: Set up tools
        uses: ./.github/actions/setup-tools
        if: inputs.scenarios == '' && inputs.ref == ''
        timeout-minutes: 11
      - name: Select VM runner
        timeout-minutes: 2
        id: host
        env:
          SOURCE_REF: ${{ inputs.ref }}
          REQUESTED_RUNNER: ${{ inputs.runner }}
          HOSTED_RUNNER: ${{ vars.KATL_VMTEST_RUNNER }}
          MAIN_RUNNER: ${{ vars.KATL_VMTEST_MAIN_RUNNER }}
        run: |
          runner="${REQUESTED_RUNNER:-${HOSTED_RUNNER:-ubuntu-24.04}}"
          case "$KATL_FLAVOUR" in standard|lts) ;; *) exit 1 ;; esac
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          trusted_main=false
          if [[ "$GITHUB_REPOSITORY" == katl-dev/katl && "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request && -z "$SOURCE_REF" ]]; then
            trusted_main=true
            if [[ -z "$REQUESTED_RUNNER" && -n "$MAIN_RUNNER" ]]; then runner="$MAIN_RUNNER"; fi
          fi
          prepared=false
          case "$runner" in
            katl-vmtest)
              if [[ "$trusted_main" != true ]]; then
                echo '::error::katl-vmtest accepts trusted main revisions only; use a hosted runner for this ref.'
                exit 1
              fi
              prepared=true
              ;;
            ubuntu-24.04) ;;
            *) echo "::error::Unsupported VM runner: $runner"; exit 1 ;;
          esac
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "prepared=$prepared" >> "$GITHUB_OUTPUT"
          echo "VM runner: $runner (prepared: $prepared)" >> "$GITHUB_STEP_SUMMARY"
      - name: Select VM groups
        timeout-minutes: 2
        id: plan
        env:
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          mkdir -p _build
          if [[ -n "$SCENARIOS" ]]; then
            printf '%s\n' "$SCENARIOS" > _build/vmtest-plan.json
          else
            .github/scripts/ci-shell go run ./cmd/katl-vmtest-plan > _build/vmtest-plan.json
          fi
          echo "matrix=$(cat _build/vmtest-plan.json)" >> "$GITHUB_OUTPUT"
          jq -e '.include | length > 0' _build/vmtest-plan.json
          echo "VM groups: $(jq -r '[.include[].name] | join(", ")' _build/vmtest-plan.json)" >> "$GITHUB_STEP_SUMMARY"

  images:
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 85
    outputs:
      mkosi-version: ${{ steps.builder.outputs.version }}
    env:
      KATL_CONTAINER_RUNTIME: docker
      KATL_MKOSI_IMAGE: localhost/katl-mkosi-builder:go-squashfs
      KATL_BUILD_COMMIT: ${{ needs.plan.outputs.source }}
      KATL_VMTEST_IMAGE_SUPPORT: '1'
      KATL_VMTEST_RUN_DIR: ${{ github.workspace }}/_build/hosted-agent
    defaults:
      run:
        shell: bash .github/scripts/ci-shell bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      # An explicit source ref takes its actions from this workflow's revision.
      # The ci shell still comes from that ref, and setup-tools rejects a ref
      # that predates it.
      - uses: actions/checkout@v7
        timeout-minutes: 2
        if: inputs.ref != ''
        with:
          ref: ${{ github.workflow_sha }}
          path: _build/workflow-actions
          persist-credentials: false
          # The builder action runs scripts/mkosi-builder from this checkout.
          sparse-checkout: |
            .github/actions/setup-tools
            .github/actions/image-caches
            .github/actions/mkosi-builder
            scripts
      - name: Set up tools from the workflow revision
        uses: ./_build/workflow-actions/.github/actions/setup-tools
        if: inputs.ref != ''
        timeout-minutes: 11
      - name: Set up tools
        uses: ./.github/actions/setup-tools
        if: inputs.ref == ''
        timeout-minutes: 11
      - uses: ./.github/actions/hosted-vmtest
        timeout-minutes: 6
        with:
          prepared: ${{ needs.plan.outputs.prepared }}
      - uses: ./_build/workflow-actions/.github/actions/image-caches
        if: inputs.ref != ''
        timeout-minutes: 5
        continue-on-error: true
        with:
          flavour: ${{ env.KATL_FLAVOUR }}
      - uses: ./.github/actions/image-caches
        id: caches
        if: inputs.ref == ''
        timeout-minutes: 5
        continue-on-error: true
        with:
          flavour: ${{ env.KATL_FLAVOUR }}
      - uses: ./_build/workflow-actions/.github/actions/mkosi-builder
        timeout-minutes: 2
        if: inputs.ref != ''
        with:
          image: ${{ env.KATL_MKOSI_IMAGE }}
      - uses: ./.github/actions/mkosi-builder
        timeout-minutes: 2
        if: inputs.ref == ''
        with:
          image: ${{ env.KATL_MKOSI_IMAGE }}
      - name: Record builder identity
        timeout-minutes: 2
        id: builder
        run: |
          cp mkosi.conf.d/ci-downloads.conf _build/mkosi-builder.txt _build/hosted-evidence/
          version="$(scripts/mkosi builder-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$KATL_BUILD_COMMIT" > _build/hosted-evidence/source.txt
          printf '%s\n' "$version" > _build/hosted-evidence/mkosi-version.txt
      - name: Resolve Kubernetes candidate
        timeout-minutes: 2
        if: inputs.kubernetes-version != ''
        env:
          PAYLOAD_VERSION: ${{ inputs.kubernetes-version }}
        run: |
          go run ./cmd/katl-kubernetes-release candidate \
            --payload-version "$PAYLOAD_VERSION" --repoquery scripts/kubernetes-repoquery \
            > _build/hosted-evidence/kubernetes-candidate.json
          jq -r '
            "KATL_KUBERNETES_PAYLOAD_VERSION=\(.payloadVersion)",
            "KATL_KUBERNETES_MINOR=\(.minor)",
            "KATL_KUBERNETES_ARTIFACT_REVISION=\(.artifactRevision)",
            "KATL_KUBERNETES_KUBEADM_VERSION=\(.kubeadmVersion)",
            "KATL_KUBERNETES_KUBELET_VERSION=\(.kubeletVersion)",
            "KATL_KUBERNETES_KUBECTL_VERSION=\(.kubectlVersion)",
            "KATL_KUBERNETES_CRITOOLS_VERSION=\(.criToolsVersion)"
          ' _build/hosted-evidence/kubernetes-candidate.json >> "$GITHUB_ENV"
      - name: Build instrumented runtime
        timeout-minutes: 13
        id: runtime
        run: .github/scripts/hosted-vmtest-measure build-runtime scripts/mkosi build-runtime
      - name: Prove guest agent and vsock on producer host
        timeout-minutes: 10
        run: |
          .github/scripts/hosted-vmtest-measure agent .github/scripts/hosted-vmtest-run \
            --artifact-set=runtime --no-rebuild ./internal/vmtest \
            -run '^TestDirectRuntimeVMTestAgentSmoke$' -count=1 -json -timeout 8m
      - name: Build shared installer and lifecycle inputs
        timeout-minutes: 11
        run: |
          .github/scripts/hosted-vmtest-measure build-install scripts/mkosi build-installer-iso
          .github/scripts/hosted-vmtest-measure build-upgrade scripts/mkosi build-katlos-upgrade-image
          .github/scripts/hosted-vmtest-measure build-kubernetes scripts/build-kubernetes-sysext
      - name: Verify and stage Kubernetes bundle
        timeout-minutes: 2
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            --env KATL_KUBERNETES_MINOR --env KATL_KUBERNETES_PAYLOAD_VERSION \
            --env KATL_KUBERNETES_KUBEADM_VERSION --env KATL_KUBERNETES_KUBELET_VERSION \
            --env KATL_KUBERNETES_KUBECTL_VERSION --env KATL_KUBERNETES_CRITOOLS_VERSION \
            "$KATL_MKOSI_IMAGE" scripts/check-kubernetes-sysext
          go run ./cmd/katl-publish-kubernetes-sysext --output-dir _build/kubernetes-bundle \
            > _build/hosted-evidence/kubernetes-bundle.txt
      - name: Package immutable test inputs
        timeout-minutes: 2
        run: .github/scripts/hosted-vmtest-measure pack .github/scripts/hosted-vmtest-package
      - uses: actions/upload-artifact@v7
        timeout-minutes: 3
        with:
          name: hosted-vmtest-${{ env.KATL_FLAVOUR }}-inputs-${{ needs.plan.outputs.source }}
          path: _build/hosted-inputs/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Collect host diagnostics
        id: diagnostics
        timeout-minutes: 2
        if: always()
        shell: bash
        run: |
          .github/scripts/hosted-vmtest-diagnostics
      - uses: actions/upload-artifact@v7
        timeout-minutes: 3
        if: always() && steps.diagnostics.outcome == 'success' && steps.diagnostics.outputs.upload-dir != ''
        with:
          name: hosted-vmtest-${{ env.KATL_FLAVOUR }}-producer-evidence-${{ github.run_id }}
          path: ${{ steps.diagnostics.outputs.upload-dir }}
          retention-days: 3
      # This job is the only saver of the image build caches, and only on
      # scheduled runs: it builds every image, so its caches hold what every
      # restorer needs. The Go cache is flavour-independent; standard saves it.
      - name: Save container Go cache
        timeout-minutes: 2
        if: github.ref == 'refs/heads/main' && github.event_name == 'schedule' && env.KATL_FLAVOUR == 'standard' && always() && steps.runtime.outcome == 'success' && steps.caches.outcome == 'success' && steps.caches.outputs.go-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.caches.outputs.go-paths }}
          key: ${{ steps.caches.outputs.go-key }}
      - name: Save mkosi RPM cache
        timeout-minutes: 2
        if: github.ref == 'refs/heads/main' && github.event_name == 'schedule' && always() && steps.runtime.outcome == 'success' && steps.caches.outcome == 'success' && steps.caches.outputs.rpm-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.caches.outputs.rpm-path }}
          key: ${{ steps.caches.outputs.rpm-key }}

  scenarios:
    name: VM / ${{ matrix.name }}
    needs: [plan, images]
    runs-on: ${{ needs.plan.outputs.runner }}
    # Every step has a budget, so go test's -timeout 35m fires inside its
    # 38-minute step and before this timeout whenever setup stays within
    # budget. A lane's groups take at most laneBudget (15 minutes) in
    # cmd/katl-vmtest-plan. Only one of the two tool setups runs.
    timeout-minutes: 95
    permissions:
      contents: read
      actions: read # hosted-download reads this run's inputs artifact.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      KATL_BUILD_COMMIT: ${{ needs.plan.outputs.source }}
      KATL_VMTEST_MKOSI_VERSION: ${{ needs.images.outputs.mkosi-version }}
      KATL_VMTEST_RUN_DIR: ${{ github.workspace }}/_build/hosted-scenario
      TEST_PACKAGE: ${{ matrix.package }}
      TEST_NAMES: ${{ matrix.tests }}
      ARTIFACT_SET: install
    defaults:
      run:
        shell: bash .github/scripts/ci-shell bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      # An explicit source ref takes its actions and download scripts from this
      # workflow's revision. The ci shell still comes from that ref, and
      # setup-tools rejects a ref that predates it.
      - uses: actions/checkout@v7
        if: inputs.ref != ''
        timeout-minutes: 2
        with:
          ref: ${{ github.workflow_sha }}
          path: _build/workflow-actions
          persist-credentials: false
          # hosted-download runs scripts/retry from this checkout.
          sparse-checkout: |
            .github/actions/setup-tools
            .github/scripts
            scripts
      - name: Set up tools from the workflow revision
        uses: ./_build/workflow-actions/.github/actions/setup-tools
        if: inputs.ref != ''
        timeout-minutes: 11
      - name: Set up tools
        uses: ./.github/actions/setup-tools
        if: inputs.ref == ''
        timeout-minutes: 11
      - uses: ./.github/actions/hosted-vmtest
        timeout-minutes: 10
        with:
          prepared: ${{ needs.plan.outputs.prepared }}
      - name: Download VM inputs
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS: hosted-vmtest-${{ env.KATL_FLAVOUR }}-inputs-${{ needs.plan.outputs.source }}
          WORKFLOW_SCRIPTS: ${{ inputs.ref != '' && '_build/workflow-actions/.github/scripts' || '.github/scripts' }}
        run: |
          "$WORKFLOW_SCRIPTS/hosted-download" artifact "$INPUTS" _build/import
      - name: Verify and import producer inputs
        timeout-minutes: 2
        run: |
          test "$(cat _build/import/source.txt)" = "$KATL_BUILD_COMMIT"
          test "$(cat _build/import/mkosi-version.txt)" = "$KATL_VMTEST_MKOSI_VERSION"
          .github/scripts/hosted-vmtest-measure unpack tar -xf _build/import/inputs.tar
          sha256sum --check _build/import/inputs.sha256 > _build/hosted-evidence/import.txt
          cp _build/import/{source.txt,mkosi-version.txt,inputs.sha256} _build/hosted-evidence/
          rm _build/import/inputs.tar
      - name: Derive component and proof inputs from the install image
        timeout-minutes: 2
        run: |
          image="$(jq -er '.artifacts[] | select(.kind == "katlos-install-image") | .path' _build/mkosi/artifacts.json)"
          unsquashfs -no-progress -d _build/mkosi/katlos-install-root "$image"
          # The install image owns these bytes; do not transfer loose duplicates or builder trees.
          ln -s "$GITHUB_WORKSPACE/_build/mkosi/katlos-install-root/components/runtime/root.squashfs" \
            _build/mkosi/katl-runtime-root.squashfs
          ln -s "$GITHUB_WORKSPACE/_build/mkosi/katlos-install-root/components/boot/katl.efi" \
            _build/mkosi/katl-runtime.efi
          (cd _build/mkosi && sha256sum --check katl-runtime-root.squashfs.sha256 katl-runtime.efi.sha256)
      - name: Run existing scenarios
        timeout-minutes: 38
        run: |
          .github/scripts/hosted-vmtest-measure scenarios .github/scripts/hosted-vmtest-run \
            --artifact-set="$ARTIFACT_SET" --no-rebuild "$TEST_PACKAGE" \
            -run "^($TEST_NAMES)$" -count=1 -json -timeout 35m
      - name: Collect host diagnostics
        id: diagnostics
        if: always()
        shell: bash
        timeout-minutes: 2
        run: |
          .github/scripts/hosted-vmtest-diagnostics
      - uses: actions/upload-artifact@v7
        if: always() && steps.diagnostics.outcome == 'success' && steps.diagnostics.outputs.upload-dir != ''
        timeout-minutes: 2
        with:
          name: hosted-vmtest-${{ env.KATL_FLAVOUR }}-${{ matrix.name }}-evidence-${{ github.run_id }}
          path: ${{ steps.diagnostics.outputs.upload-dir }}
          retention-days: 3
