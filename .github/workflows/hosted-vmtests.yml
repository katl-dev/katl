name: Hosted VM scenarios

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted runner or katl-vmtest (main only); blank uses repository settings
        type: string
      flavour:
        description: Kernel flavour
        type: choice
        options: [standard, lts]
        default: standard
      ref:
        description: Source commit to qualify; blank uses the workflow revision
        type: string
  workflow_call:
    inputs:
      runner:
        description: Hosted runner or katl-vmtest (main only); blank uses repository settings
        type: string
      flavour:
        type: string
        default: standard
      ref:
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-vmtests-${{ inputs.flavour || 'standard' }}-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

env:
  KATL_FLAVOUR: ${{ inputs.flavour || 'standard' }}
  KATL_VMTEST_KVM: 'on'
  KATL_VMTEST_KEEP: failed
  KATL_VMTEST_DEBUG_ON_FAILURE: '0'
  KATL_OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
  KATL_OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
  KATL_VMTEST_GO: ${{ github.workspace }}/.github/scripts/hosted-vmtest-go

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run: ${{ steps.plan.outputs.run }}
      matrix: ${{ steps.plan.outputs.matrix }}
      runner: ${{ steps.host.outputs.runner }}
      prepared: ${{ steps.host.outputs.prepared }}
      source: ${{ steps.host.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Select VM runner
        id: host
        env:
          SOURCE_REF: ${{ inputs.ref }}
          REQUESTED_RUNNER: ${{ inputs.runner }}
          HOSTED_RUNNER: ${{ vars.KATL_VMTEST_RUNNER }}
          MAIN_RUNNER: ${{ vars.KATL_VMTEST_MAIN_RUNNER }}
        run: |
          runner="${REQUESTED_RUNNER:-${HOSTED_RUNNER:-ubuntu-24.04}}"
          case "$KATL_FLAVOUR" in standard|lts) ;; *) exit 1 ;; esac
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          trusted_main=false
          if [[ "$GITHUB_REPOSITORY" == katl-dev/katl && "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request && -z "$SOURCE_REF" ]]; then
            trusted_main=true
            if [[ -z "$REQUESTED_RUNNER" && -n "$MAIN_RUNNER" ]]; then runner="$MAIN_RUNNER"; fi
          fi
          prepared=false
          case "$runner" in
            katl-vmtest)
              if [[ "$trusted_main" != true ]]; then
                echo '::error::katl-vmtest accepts trusted main revisions only; use a hosted runner for this ref.'
                exit 1
              fi
              prepared=true
              ;;
            ubuntu-24.04|blacksmith-2vcpu-ubuntu-2404|blacksmith-4vcpu-ubuntu-2404|blacksmith-8vcpu-ubuntu-2404) ;;
            *) echo "::error::Unsupported VM runner: $runner"; exit 1 ;;
          esac
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "prepared=$prepared" >> "$GITHUB_OUTPUT"
          echo "VM runner: $runner (prepared: $prepared)" >> "$GITHUB_STEP_SUMMARY"
      - name: Select VM groups
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p _build
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # Include both sides of renames so moving a product file into docs cannot skip its gate.
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > _build/vmtest-changes
            go run ./cmd/katl-vmtest-plan --changed < _build/vmtest-changes > _build/vmtest-plan.json
          else
            go run ./cmd/katl-vmtest-plan > _build/vmtest-plan.json
          fi
          echo "matrix=$(cat _build/vmtest-plan.json)" >> "$GITHUB_OUTPUT"
          echo "run=$(jq '.include | length > 0' _build/vmtest-plan.json)" >> "$GITHUB_OUTPUT"
          echo "VM groups: $(jq -r '[.include[].name] | join(", ")' _build/vmtest-plan.json)" >> "$GITHUB_STEP_SUMMARY"

  images:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 60
    outputs:
      mkosi-version: ${{ steps.builder.outputs.version }}
    env:
      KATL_CONTAINER_RUNTIME: docker
      KATL_MKOSI_IMAGE: localhost/katl-mkosi-builder:go-squashfs
      KATL_BUILD_COMMIT: ${{ needs.plan.outputs.source }}
      KATL_VMTEST_IMAGE_SUPPORT: '1'
      KATL_VMTEST_RUN_DIR: ${{ github.workspace }}/_build/hosted-agent
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/hosted-vmtest
        with:
          prepared: ${{ needs.plan.outputs.prepared }}
      - uses: actions/cache/restore@v6
        id: build-cache
        with:
          path: |
            _build/go-mod
            _build/go-cache
            _build/mkosi/package-cache
          key: hosted-vmtest-build-${{ env.KATL_FLAVOUR }}-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'Containerfile.mkosi', 'mkosi.conf', 'mkosi.profiles/**/mkosi.conf', 'kernels/**') }}-${{ needs.plan.outputs.source }}
          restore-keys: |
            hosted-vmtest-build-${{ env.KATL_FLAVOUR }}-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'Containerfile.mkosi', 'mkosi.conf', 'mkosi.profiles/**/mkosi.conf', 'kernels/**') }}-
      - uses: ./.github/actions/mkosi-builder
        with:
          profile: hosted-vmtest
          image: ${{ env.KATL_MKOSI_IMAGE }}
      - name: Record builder identity
        id: builder
        run: |
          cp mkosi.conf.d/ci-downloads.conf _build/hosted-evidence/
          version="$(scripts/mkosi builder-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$KATL_BUILD_COMMIT" > _build/hosted-evidence/source.txt
          printf '%s\n' "$version" > _build/hosted-evidence/mkosi-version.txt
      - name: Build instrumented runtime
        id: runtime
        run: .github/scripts/hosted-vmtest-measure build-runtime scripts/mkosi build-runtime
      - name: Prove guest agent and vsock on producer host
        run: |
          .github/scripts/hosted-vmtest-measure agent .github/scripts/hosted-vmtest-run \
            --artifact-set=runtime --no-rebuild ./internal/vmtest \
            -run '^TestDirectRuntimeVMTestAgentSmoke$' -count=1 -json -timeout 8m
          jq -se 'any(.[]; .Action == "pass" and .Test == "TestDirectRuntimeVMTestAgentSmoke")' \
            _build/hosted-evidence/go-test.jsonl
      - name: Build shared installer and lifecycle inputs
        run: |
          .github/scripts/hosted-vmtest-measure build-install scripts/mkosi build-installer-iso
          .github/scripts/hosted-vmtest-measure build-upgrade scripts/mkosi build-katlos-upgrade-image
          .github/scripts/hosted-vmtest-measure build-kubernetes scripts/build-kubernetes-sysext
      - name: Package immutable test inputs
        run: .github/scripts/hosted-vmtest-measure pack .github/scripts/hosted-vmtest-package
      - uses: actions/upload-artifact@v7
        with:
          name: hosted-vmtest-${{ env.KATL_FLAVOUR }}-base-${{ needs.plan.outputs.source }}
          path: _build/hosted-inputs/base/
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: hosted-vmtest-${{ env.KATL_FLAVOUR }}-media-${{ needs.plan.outputs.source }}
          path: _build/hosted-inputs/media/
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: hosted-vmtest-${{ env.KATL_FLAVOUR }}-upgrade-${{ needs.plan.outputs.source }}
          path: _build/hosted-inputs/upgrade/
          compression-level: 0
          retention-days: 1
      - name: Collect host diagnostics
        if: always()
        run: |
          .github/scripts/hosted-vmtest-diagnostics
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hosted-vmtest-${{ env.KATL_FLAVOUR }}-producer-evidence-${{ github.run_id }}
          path: |
            _build/hosted-evidence/
            _build/hosted-agent/**/*.log
            _build/hosted-agent/**/*.json
            _build/hosted-agent/**/*.xml
            _build/hosted-agent/**/*.txt
            _build/hosted-agent/**/*.stdout
            _build/hosted-agent/**/*.stderr
          retention-days: 3
      - uses: actions/cache/save@v6
        if: always() && steps.runtime.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            _build/go-mod
            _build/go-cache
            _build/mkosi/package-cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  scenarios:
    name: VM / ${{ matrix.name }}
    needs: [plan, images]
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      KATL_BUILD_COMMIT: ${{ needs.plan.outputs.source }}
      KATL_VMTEST_MKOSI_VERSION: ${{ needs.images.outputs.mkosi-version }}
      KATL_VMTEST_RUN_DIR: ${{ github.workspace }}/_build/hosted-scenario
      TEST_PACKAGE: ${{ matrix.package }}
      TEST_NAMES: ${{ matrix.tests }}
      ARTIFACT_SET: ${{ matrix.name == 'boot' && 'none' || 'install' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/hosted-vmtest
        with:
          prepared: ${{ needs.plan.outputs.prepared }}
      - uses: actions/download-artifact@v8
        if: matrix.name != 'boot'
        with:
          name: hosted-vmtest-${{ env.KATL_FLAVOUR }}-base-${{ needs.plan.outputs.source }}
          path: _build/import/base
      - uses: actions/download-artifact@v8
        if: matrix.name == 'boot' || matrix.name == 'install' || matrix.name == 'storage'
        with:
          name: hosted-vmtest-${{ env.KATL_FLAVOUR }}-media-${{ needs.plan.outputs.source }}
          path: _build/import/media
      - uses: actions/download-artifact@v8
        if: matrix.name == 'update'
        with:
          name: hosted-vmtest-${{ env.KATL_FLAVOUR }}-upgrade-${{ needs.plan.outputs.source }}
          path: _build/import/upgrade
      - name: Verify and import producer inputs
        run: |
          for bundle in _build/import/*; do
            test "$(cat "$bundle/source.txt")" = "$KATL_BUILD_COMMIT"
            test "$(cat "$bundle/mkosi-version.txt")" = "$KATL_VMTEST_MKOSI_VERSION"
            .github/scripts/hosted-vmtest-measure "unpack-${bundle##*/}" tar -xf "$bundle/inputs.tar"
            sha256sum --check "$bundle/inputs.sha256" > "_build/hosted-evidence/import-${bundle##*/}.txt"
            mkdir -p "_build/hosted-evidence/inputs-${bundle##*/}"
            cp "$bundle/"{source.txt,mkosi-version.txt,inputs.sha256} "_build/hosted-evidence/inputs-${bundle##*/}/"
            rm "$bundle/inputs.tar"
          done
      - name: Derive component and proof inputs from the install image
        if: matrix.name != 'boot'
        run: |
          images=(_build/mkosi/katlos-install-*-x86_64.squashfs)
          test "${#images[@]}" = 1
          unsquashfs -no-progress -d _build/mkosi/katlos-install-root "${images[0]}"
          # The install image owns these bytes; do not transfer loose duplicates or builder trees.
          ln -s "$GITHUB_WORKSPACE/_build/mkosi/katlos-install-root/components/runtime/root.squashfs" \
            _build/mkosi/katl-runtime-root.squashfs
          ln -s "$GITHUB_WORKSPACE/_build/mkosi/katlos-install-root/components/boot/katl.efi" \
            _build/mkosi/katl-runtime.efi
          (cd _build/mkosi && sha256sum --check katl-runtime-root.squashfs.sha256 katl-runtime.efi.sha256)
      - name: Run existing scenarios
        run: |
          .github/scripts/hosted-vmtest-measure scenarios .github/scripts/hosted-vmtest-run \
            --artifact-set="$ARTIFACT_SET" --no-rebuild "$TEST_PACKAGE" \
            -run "^($TEST_NAMES)$" -count=1 -json -timeout 45m
          # A successful test process must actually pass every selected VM test.
          IFS='|' read -ra tests <<< "$TEST_NAMES"
          for test_name in "${tests[@]}"; do
            jq -se --arg test "$test_name" 'any(.[]; .Action == "pass" and .Test == $test)' \
              _build/hosted-evidence/go-test.jsonl
          done
      - name: Collect host diagnostics
        if: always()
        run: |
          .github/scripts/hosted-vmtest-diagnostics
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hosted-vmtest-${{ env.KATL_FLAVOUR }}-${{ matrix.name }}-evidence-${{ github.run_id }}
          path: |
            _build/hosted-evidence/
            _build/hosted-scenario/**/*.log
            _build/hosted-scenario/**/*.json
            _build/hosted-scenario/**/*.xml
            _build/hosted-scenario/**/*.txt
            _build/hosted-scenario/**/*.stdout
            _build/hosted-scenario/**/*.stderr
          retention-days: 3

  validation:
    name: VM validation
    if: always()
    needs: [plan, images, scenarios]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PLAN: ${{ needs.plan.result }}
      RUN: ${{ needs.plan.outputs.run }}
      IMAGES: ${{ needs.images.result }}
      SCENARIOS: ${{ needs.scenarios.result }}
    steps:
      - name: Require the selected gates
        run: |
          test "$PLAN" = success
          if [[ "$RUN" == true ]]; then
            test "$IMAGES" = success
            test "$SCENARIOS" = success
          else
            test "$RUN" = false
            test "$IMAGES" = skipped
            test "$SCENARIOS" = skipped
          fi
