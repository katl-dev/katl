name: Kubernetes Bundle Artifacts

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kubernetes-bundles.yml
      - Containerfile.mkosi
      - cmd/katl-kubernetes-release/**
      - "!cmd/katl-kubernetes-release/**/*_test.go"
      - cmd/katl-mkosi-artifacts/**
      - "!cmd/katl-mkosi-artifacts/**/*_test.go"
      - cmd/katl-publish-kubernetes-sysext/**
      - "!cmd/katl-publish-kubernetes-sysext/**/*_test.go"
      - containers-policy.json
      - go.mod
      - go.sum
      - internal/installer/artifact/artifact.go
      - internal/installer/artifact/local.go
      - internal/installer/payloadbundle/**
      - internal/installer/sysextcatalog/catalog.go
      - internal/installer/sysextcatalog/publish.go
      - internal/installer/sysextcatalog/stage.go
      - internal/kubernetesrelease/**
      - "!internal/kubernetesrelease/**/*_test.go"
      - internal/kubernetesrelease/supported-versions.json
      - mkosi.conf
      - mkosi.profiles/kubernetes-sysext/**
      - mkosi.profiles/runtime/mkosi.conf
      - mkosi.profiles/runtime/os-release.in
      - scripts/build-kubernetes-sysext
      - scripts/check-kubernetes-sysext
  workflow_dispatch:
    inputs:
      payload_version:
        description: Exact supported Kubernetes payload; empty builds every supported version
        required: false
        type: string
      publish:
        description: Publish verified OCI artifacts to ghcr.io/katl-dev/kubernetes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-x86_64
  cancel-in-progress: false

jobs:
  plan:
    name: Plan Supported Bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    env:
      DISPATCH_PAYLOAD_VERSION: ${{ inputs.payload_version }}
      DISPATCH_PUBLISH: ${{ inputs.publish }}
      GOTOOLCHAIN: auto
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify bundle recipe revisions
        run: go run ./cmd/katl-kubernetes-release verify-recipe

      - name: Resolve supported release matrix
        id: plan
        shell: bash
        run: |
          args=(matrix)
          if [[ -n "$DISPATCH_PAYLOAD_VERSION" ]]; then
            args+=(--payload-version "$DISPATCH_PAYLOAD_VERSION")
          fi
          previous_commit=""
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            previous_commit="${{ github.event.before }}"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            previous_commit="${{ github.event.pull_request.base.sha }}"
          fi
          if [[ -n "$previous_commit" ]]; then
            previous="$RUNNER_TEMP/previous-supported-versions.json"
            previous_ref="${previous_commit}:internal/kubernetesrelease/supported-versions.json"
            if ! git cat-file -e "${previous_commit}^{commit}"; then
              echo "error: comparison commit is unavailable: $previous_commit" >&2
              exit 1
            fi
            if git cat-file -e "$previous_ref"; then
              git show "$previous_ref" > "$previous"
              if jq -e '
                .apiVersion == "katl.dev/v1alpha1" and
                .kind == "KubernetesSupportedVersions" and
                (.recipeDigest | type == "string") and
                (.versions | type == "array")
              ' "$previous" >/dev/null; then
                args+=(--previous-supported-versions "$previous")
              elif ! jq -e '
                .apiVersion == "katl.dev/v1alpha1" and
                .kind == "KubernetesSupportedVersions" and
                (.versions | type == "array") and
                all(.versions[]; type == "string")
              ' "$previous" >/dev/null; then
                echo "error: previous supported-version policy is malformed" >&2
                exit 1
              fi
            fi
          fi
          matrix="$(go run ./cmd/katl-kubernetes-release "${args[@]}")"

          publish=false
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            publish="$DISPATCH_PUBLISH"
          fi
          if [[ "$publish" != "true" && "$publish" != "false" ]]; then
            echo "error: publish must be true or false" >&2
            exit 1
          fi

          {
            echo "matrix=$(jq -c . <<<"$matrix")"
            echo "build=$(jq -r '.include | length > 0' <<<"$matrix")"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.release.payloadVersion }}
    if: ${{ needs.plan.outputs.build == 'true' }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      ARTIFACT_VERSION: ${{ matrix.release.artifactVersion }}
      GOTOOLCHAIN: auto
      KATL_ARCHITECTURE: x86_64
      KATL_BUILD_COMMIT: ${{ matrix.release.artifactVersion }}
      KATL_CONTAINER_RUNTIME: docker
      KATL_KUBERNETES_ARTIFACT_REVISION: ${{ matrix.release.artifactRevision }}
      KATL_KUBERNETES_CRITOOLS_VERSION: ${{ matrix.release.criToolsVersion }}
      KATL_KUBERNETES_KUBEADM_VERSION: ${{ matrix.release.kubeadmVersion }}
      KATL_KUBERNETES_KUBECTL_VERSION: ${{ matrix.release.kubectlVersion }}
      KATL_KUBERNETES_KUBELET_VERSION: ${{ matrix.release.kubeletVersion }}
      KATL_KUBERNETES_MINOR: ${{ matrix.release.minor }}
      KATL_KUBERNETES_PAYLOAD_VERSION: ${{ matrix.release.payloadVersion }}
      KATL_MKOSI_IMAGE: localhost/katl-mkosi-builder:fedora-44-go-squashfs
      OCI_REPOSITORY: ghcr.io/katl-dev/kubernetes
      OCI_DESCRIPTION: Kubernetes system extension bundle for KatlOS nodes
      OCI_LICENSES: MIT
      OCI_TITLE: KatlOS Kubernetes system extension
      KUBERNETES_RELEASE_URL: https://github.com/kubernetes/kubernetes/releases/tag/${{ matrix.release.payloadVersion }}
      PAYLOAD_VERSION: ${{ matrix.release.payloadVersion }}
      PUBLISH: ${{ needs.plan.outputs.publish }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set reproducible build timestamp
        shell: bash
        run: |
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          {
            echo "SOURCE_DATE_EPOCH=$source_date_epoch"
            echo "OCI_CREATED=$(date --utc --date="@${source_date_epoch}" +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      - name: Restore Katl Go build caches
        uses: actions/cache@v6
        with:
          path: |
            _build/go-mod
            _build/go-cache
          key: katl-go-${{ runner.os }}-${{ env.KATL_ARCHITECTURE }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            katl-go-${{ runner.os }}-${{ env.KATL_ARCHITECTURE }}-

      - name: Restore mkosi package cache
        uses: actions/cache@v6
        with:
          path: _build/mkosi/package-cache
          key: katl-kubernetes-packages-${{ runner.os }}-${{ env.KATL_ARCHITECTURE }}-fedora-44-${{ hashFiles('Containerfile.mkosi', 'mkosi.conf', 'mkosi.profiles/kubernetes-sysext/**', 'mkosi.profiles/runtime/**') }}
          restore-keys: |
            katl-kubernetes-packages-${{ runner.os }}-${{ env.KATL_ARCHITECTURE }}-fedora-44-
            katl-mkosi-packages-${{ runner.os }}-${{ env.KATL_ARCHITECTURE }}-fedora-44-

      - name: Run producer unit tests
        run: |
          go test ./cmd/katl-publish-kubernetes-sysext \
            ./internal/installer/kubernetesbundle \
            ./internal/installer/sysextcatalog \
            ./internal/kubernetesrelease \
            -count=1

      - name: Build compatible runtime and Kubernetes sysext
        shell: bash
        run: |
          scripts/mkosi build-runtime
          scripts/build-kubernetes-sysext

      - name: Verify built runtime and Kubernetes sysext
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --env KATL_REPO_ROOT=/work \
            --env KATL_ARCHITECTURE \
            --env KATL_KUBERNETES_ARTIFACT_REVISION \
            --env KATL_KUBERNETES_CRITOOLS_VERSION \
            --env KATL_KUBERNETES_KUBEADM_VERSION \
            --env KATL_KUBERNETES_KUBECTL_VERSION \
            --env KATL_KUBERNETES_KUBELET_VERSION \
            --env KATL_KUBERNETES_MINOR \
            --env KATL_KUBERNETES_PAYLOAD_VERSION \
            "$KATL_MKOSI_IMAGE" \
            bash -euo pipefail -c '
              scripts/check-runtime-root
              scripts/check-kubernetes-sysext
            '

      - name: Stage Kubernetes payload bundle
        id: bundle
        shell: bash
        run: |
          go run ./cmd/katl-publish-kubernetes-sysext \
            --metadata _build/mkosi/katl-kubernetes.raw.json \
            --output-dir dist \
            --annotation "org.opencontainers.image.title=${OCI_TITLE}" \
            --annotation "org.opencontainers.image.created=${OCI_CREATED}" \
            --annotation "org.opencontainers.image.description=${OCI_DESCRIPTION}" \
            --annotation "org.opencontainers.image.licenses=${OCI_LICENSES}" \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.url=${KUBERNETES_RELEASE_URL}" \
            --annotation "org.opencontainers.image.documentation=https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/installing.md" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.version=${ARTIFACT_VERSION}" \
            --annotation "dev.katl.bundle.kind=kubernetes" \
            --annotation "dev.katl.kubernetes.payload.version=${PAYLOAD_VERSION}" \
            | tee _build/kubernetes-bundle-stage.txt

          metadata=_build/mkosi/katl-kubernetes.raw.json
          actual_payload="$(jq -r '.payloadVersion' "$metadata")"
          actual_artifact="$(jq -r '.version' "$metadata")"
          architecture="$(jq -r '.architecture' "$metadata")"
          if [[ "$actual_payload" != "$PAYLOAD_VERSION" ]]; then
            echo "error: built payload version $actual_payload does not match $PAYLOAD_VERSION" >&2
            exit 1
          fi
          if [[ "$actual_artifact" != "$ARTIFACT_VERSION" ]]; then
            echo "error: built artifact version $actual_artifact does not match $ARTIFACT_VERSION" >&2
            exit 1
          fi
          if [[ "$architecture" != "$KATL_ARCHITECTURE" ]]; then
            echo "error: built architecture $architecture does not match $KATL_ARCHITECTURE" >&2
            exit 1
          fi

          bundle_digest="$(awk '$1 == "bundle-manifest-digest:" { print $2 }' _build/kubernetes-bundle-stage.txt)"
          if [[ ! "$bundle_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "error: invalid staged bundle digest: $bundle_digest" >&2
            exit 1
          fi
          manifest_digest="$(awk '$1 == "oci-manifest-digest:" { print $2 }' _build/kubernetes-bundle-stage.txt)"
          if [[ ! "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "error: invalid packed OCI manifest digest: $manifest_digest" >&2
            exit 1
          fi
          manifest_tag="$(awk '$1 == "oci-manifest-tag:" { print $2 }' _build/kubernetes-bundle-stage.txt)"
          if [[ ! "$manifest_tag" =~ ^manifest-sha256-[0-9a-f]{64}$ ]]; then
            echo "error: invalid referrer-safe OCI manifest tag: $manifest_tag" >&2
            exit 1
          fi
          version_tag="$ARTIFACT_VERSION"
          bundle_dir="dist/bundles/${PAYLOAD_VERSION}/${architecture}"
          raw="dist/katl-kubernetes-${PAYLOAD_VERSION}-${architecture}.sysext.raw"

          (
            cd dist
            sha256sum --check "$(basename "$raw").sha256"
            sha256sum --check checksums.txt
          )

          {
            echo "architecture=$architecture"
            echo "bundle-digest=$bundle_digest"
            echo "bundle-dir=$bundle_dir"
            echo "digest-tag=$manifest_tag"
            echo "manifest-digest=$manifest_digest"
            echo "raw=$raw"
            echo "version-tag=$version_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Upload inspected bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: katl-kubernetes-bundle-${{ env.ARTIFACT_VERSION }}-${{ steps.bundle.outputs.architecture }}
          path: dist/
          if-no-files-found: error

      - name: Log in to GHCR
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish immutable OCI bundle
        if: ${{ env.PUBLISH == 'true' }}
        id: publish
        shell: bash
        env:
          BUNDLE_DIR: ${{ steps.bundle.outputs.bundle-dir }}
          DIGEST_TAG: ${{ steps.bundle.outputs.digest-tag }}
          LOCAL_MANIFEST_DIGEST: ${{ steps.bundle.outputs.manifest-digest }}
          VERSION_TAG: ${{ steps.bundle.outputs.version-tag }}
        run: |
          go run ./cmd/katl-publish-kubernetes-sysext \
            --metadata _build/mkosi/katl-kubernetes.raw.json \
            --output-dir dist \
            --publish-ref "${OCI_REPOSITORY}:${VERSION_TAG}" \
            --publish-ref "${OCI_REPOSITORY}:${DIGEST_TAG}" \
            --annotation "org.opencontainers.image.title=${OCI_TITLE}" \
            --annotation "org.opencontainers.image.created=${OCI_CREATED}" \
            --annotation "org.opencontainers.image.description=${OCI_DESCRIPTION}" \
            --annotation "org.opencontainers.image.licenses=${OCI_LICENSES}" \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.url=${KUBERNETES_RELEASE_URL}" \
            --annotation "org.opencontainers.image.documentation=https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/installing.md" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.version=${ARTIFACT_VERSION}" \
            --annotation "dev.katl.bundle.kind=kubernetes" \
            --annotation "dev.katl.kubernetes.payload.version=${PAYLOAD_VERSION}" \
            | tee _build/kubernetes-bundle-publish.txt
          manifest_digest="$(awk '$1 ~ /^(published|already-published):$/ { split($2, parts, "@"); print parts[2] }' _build/kubernetes-bundle-publish.txt | sort -u)"
          if [[ "$manifest_digest" != "$LOCAL_MANIFEST_DIGEST" ]]; then
            echo "error: published OCI manifest digest $manifest_digest does not match packed digest $LOCAL_MANIFEST_DIGEST" >&2
            exit 1
          fi
          echo "manifest-digest=$manifest_digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Published Kubernetes bundle"
            echo
            echo "- OCI: \`${OCI_REPOSITORY}@${manifest_digest}\`"
            echo "- Kubernetes bundle: \`${OCI_REPOSITORY}:${VERSION_TAG}@${manifest_digest}\`"
            echo "- Version tag: \`${OCI_REPOSITORY}:${VERSION_TAG}\`"
            echo "- Digest tag: \`${OCI_REPOSITORY}:${DIGEST_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest published OCI manifest
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.OCI_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.manifest-digest }}
          push-to-registry: true

      - name: Write compatibility record
        if: ${{ env.PUBLISH == 'true' }}
        env:
          BUNDLE_DIR: ${{ steps.bundle.outputs.bundle-dir }}
          MANIFEST_DIGEST: ${{ steps.publish.outputs.manifest-digest }}
        shell: bash
        run: |
          mkdir -p _build/compatibility
          runtime_interfaces="$(jq -c '.supportedRuntimeInterfaces' "${BUNDLE_DIR}/catalog-entry.json")"
          jq -n \
            --arg architecture "$KATL_ARCHITECTURE" \
            --arg artifactVersion "$ARTIFACT_VERSION" \
            --arg manifestDigest "$MANIFEST_DIGEST" \
            --arg payloadVersion "$PAYLOAD_VERSION" \
            --argjson runtimeInterfaces "$runtime_interfaces" \
            '{
              architecture: $architecture,
              artifactVersion: $artifactVersion,
              manifestDigest: $manifestDigest,
              payloadVersion: $payloadVersion,
              runtimeInterfaces: $runtimeInterfaces
            }' > "_build/compatibility/${PAYLOAD_VERSION}.json"

      - name: Upload compatibility record
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: kubernetes-compatibility-${{ env.PAYLOAD_VERSION }}
          path: _build/compatibility/*.json
          if-no-files-found: error

  presubmit:
    name: Kubernetes Bundle Presubmit
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - plan
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BUILD_REQUIRED: ${{ needs.plan.outputs.build }}
      BUILD_RESULT: ${{ needs.build.result }}
      PLAN_RESULT: ${{ needs.plan.result }}
    steps:
      - name: Require successful producer validation
        shell: bash
        run: |
          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "error: Kubernetes bundle planning did not succeed: $PLAN_RESULT" >&2
            exit 1
          fi
          if [[ "$BUILD_REQUIRED" == "true" && "$BUILD_RESULT" != "success" ]]; then
            echo "error: Kubernetes bundle builds did not succeed: $BUILD_RESULT" >&2
            exit 1
          fi
          if [[ "$BUILD_REQUIRED" == "false" && "$BUILD_RESULT" != "skipped" ]]; then
            echo "error: unexpected Kubernetes bundle build result: $BUILD_RESULT" >&2
            exit 1
          fi

  compatibility:
    name: Record Published Compatibility
    if: ${{ always() && needs.plan.outputs.build == 'true' && needs.plan.outputs.publish == 'true' && needs.build.result == 'success' }}
    needs:
      - plan
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download compatibility records
        uses: actions/download-artifact@v8
        with:
          pattern: kubernetes-compatibility-*
          path: _build/compatibility
          merge-multiple: true

      - name: Record published compatibility
        id: compatibility
        shell: bash
        run: |
          shopt -s nullglob
          records=(_build/compatibility/*.json)
          if [[ "${#records[@]}" -eq 0 ]]; then
            echo "error: no Kubernetes compatibility records were downloaded" >&2
            exit 1
          fi
          for record in "${records[@]}"; do
            payload_version="$(jq -r '.payloadVersion' "$record")"
            artifact_version="$(jq -r '.artifactVersion' "$record")"
            manifest_digest="$(jq -r '.manifestDigest' "$record")"
            architecture="$(jq -r '.architecture' "$record")"
            runtime_interfaces="$(jq -r '.runtimeInterfaces | join(",")' "$record")"
            go run ./cmd/katl-kubernetes-release record-compatibility \
              --payload-version "$payload_version" \
              --artifact-version "$artifact_version" \
              --manifest-digest "$manifest_digest" \
              --architecture "$architecture" \
              --runtime-interfaces "$runtime_interfaces"
          done
          if git diff --quiet -- internal/installer/kubernetescompat/catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish compatibility update branch
        if: ${{ steps.compatibility.outputs.changed == 'true' }}
        id: compatibility-branch
        shell: bash
        run: |
          branch="automation/kubernetes-compatibility-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add internal/installer/kubernetescompat/catalog.json
          git commit -m "release: record supported Kubernetes compatibility"
          head_sha="$(git rev-parse HEAD)"
          git push --set-upstream origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Open compatibility pull request
        if: ${{ steps.compatibility.outputs.changed == 'true' }}
        uses: actions/github-script@v8
        env:
          HEAD_BRANCH: ${{ steps.compatibility-branch.outputs.name }}
          HEAD_SHA: ${{ steps.compatibility-branch.outputs.sha }}
        with:
          script: |
            const { data: pull } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: "main",
              head: process.env.HEAD_BRANCH,
              title: "release: record supported Kubernetes compatibility",
              body: "Records the newly published immutable bundles for every supported Kubernetes payload built by the producer.",
              draft: false,
            });
            await github.graphql(`
              mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) {
                  pullRequest { number }
                }
              }
            `, { pullRequestId: pull.node_id });

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: "main",
              state: "open",
              per_page: 100,
            });
            const branchPrefix = "automation/kubernetes-compatibility-";
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const superseded = openPulls.filter(candidate =>
              candidate.number !== pull.number &&
              candidate.head.repo?.full_name === repository &&
              candidate.head.ref.startsWith(branchPrefix)
            );
            for (const candidate of superseded) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: candidate.number,
                body: `Superseded by #${pull.number}, which records newer successfully published Kubernetes bundles. Closing this stale catalog update to prevent older bundle references from being merged.`,
              });
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: candidate.number,
                state: "closed",
              });
            }

            let validationRun;
            for (let attempt = 0; attempt < 12; attempt++) {
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "fast-checks.yml",
                branch: process.env.HEAD_BRANCH,
                event: "pull_request",
                per_page: 10,
              });
              validationRun = runs.workflow_runs.find(run =>
                run.head_sha === process.env.HEAD_SHA
              );
              if (validationRun) {
                break;
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!validationRun) {
              throw new Error(`Fast Checks pull_request run was not created for ${process.env.HEAD_BRANCH}@${process.env.HEAD_SHA}`);
            }
            if (validationRun.conclusion === "action_required") {
              await github.request("POST /repos/{owner}/{repo}/actions/runs/{run_id}/approve", {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: validationRun.id,
              });
              core.info(`Approved Fast Checks run ${validationRun.id} for generated PR #${pull.number}`);
            } else {
              core.info(`Fast Checks run ${validationRun.id} requires no approval (${validationRun.status}/${validationRun.conclusion || "pending"})`);
            }
