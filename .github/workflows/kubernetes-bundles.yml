name: Kubernetes Bundle Artifacts

on:
  schedule:
    - cron: '41 * * * *'
  pull_request:
  push:
    branches: [main]
    paths:
      - .github/workflows/kubernetes-bundles.yml
      - Containerfile.mkosi
      - go.mod
      - go.sum
      - internal/kubernetesrelease/**
      - internal/installer/payloadbundle/**
      - internal/installer/sysextcatalog/**
      - internal/installer/kubernetescompat/**
      - cmd/katl-kubernetes-release/**
      - cmd/katl-kubernetes-metadata/**
      - cmd/katl-publish-kubernetes-sysext/**
      - mkosi.conf
      - mkosi.profiles/kubernetes-sysext/**
      - mkosi.profiles/runtime/**
      - scripts/mkosi
      - scripts/*kubernetes*
  workflow_dispatch:
    inputs:
      payload_version:
        description: Stable Kubernetes version; empty discovers the latest patch of each maintained minor
        type: string
      publish:
        description: Publish verified bundles (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kubernetes-bundles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan Supported Bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      publish: ${{ steps.plan.outputs.publish }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve release matrix
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_VERSION: ${{ inputs.payload_version }}
          REQUEST_PUBLISH: ${{ inputs.publish }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [[ -n "$PAYLOAD_VERSION" ]]; then
            [[ "$PAYLOAD_VERSION" =~ ^v1\.[0-9]+\.[0-9]+$ ]]
            matrix="$(jq -cn --arg version "$PAYLOAD_VERSION" '{include:[{payloadVersion:$version}]}')"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            matrix="$(go run ./cmd/katl-kubernetes-release presubmit --base "$BASE_SHA")"
          else
            matrix="$(go run ./cmd/katl-kubernetes-release discover)"
          fi
          publish=false
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$REQUEST_PUBLISH" == true ]]; then
              publish=true
            fi
          fi
          {
            echo "matrix=$matrix"
            echo "publish=$publish"
            echo "build=$(jq -r '.include | length > 0' <<<"$matrix")"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.release.payloadVersion }}
    if: needs.plan.outputs.build == 'true'
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write
    env:
      KATL_ARCHITECTURE: x86_64
      KATL_CONTAINER_RUNTIME: docker
      KATL_MKOSI_IMAGE: localhost/katl-mkosi-builder:fedora-44-go-squashfs
      OCI_REPOSITORY: ghcr.io/katl-dev/kubernetes
      PAYLOAD_VERSION: ${{ matrix.release.payloadVersion }}
      KUBERNETES_RELEASE_URL: https://github.com/kubernetes/kubernetes/releases/tag/${{ matrix.release.payloadVersion }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build package query environment
        run: docker build --tag "$KATL_MKOSI_IMAGE" --file Containerfile.mkosi .
      - name: Resolve locked candidate
        run: |
          go run ./cmd/katl-kubernetes-release candidate \
            --payload-version "$PAYLOAD_VERSION" \
            --repoquery scripts/kubernetes-repoquery > candidate.json
          jq -r '
            "ARTIFACT_VERSION=\(.artifactVersion)",
            "KATL_BUILD_COMMIT=\(.artifactVersion)",
            "KATL_KUBERNETES_PAYLOAD_VERSION=\(.payloadVersion)",
            "KATL_KUBERNETES_MINOR=\(.minor)",
            "KATL_KUBERNETES_ARTIFACT_REVISION=\(.artifactRevision)",
            "KATL_KUBERNETES_KUBEADM_VERSION=\(.kubeadmVersion)",
            "KATL_KUBERNETES_KUBELET_VERSION=\(.kubeletVersion)",
            "KATL_KUBERNETES_KUBECTL_VERSION=\(.kubectlVersion)",
            "KATL_KUBERNETES_CRITOOLS_VERSION=\(.criToolsVersion)"
          ' candidate.json >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resume existing candidate
        id: candidate
        run: |
          if [[ "$PUBLISH" == true ]]; then
            go run ./cmd/katl-kubernetes-release inspect \
              --payload-version "$PAYLOAD_VERSION" --artifact-version "$ARTIFACT_VERSION" > existing.json
          else
            echo '{"exists":false}' > existing.json
          fi
          echo "exists=$(jq -r .exists existing.json)" >> "$GITHUB_OUTPUT"
          echo "promoted=$(jq -r .promoted existing.json)" >> "$GITHUB_OUTPUT"
      - name: Run producer tests
        run: |
          go test ./cmd/katl-kubernetes-release ./cmd/katl-kubernetes-metadata \
            ./cmd/katl-publish-kubernetes-sysext ./internal/kubernetesrelease \
            ./internal/installer/kubernetesbundle ./internal/installer/kubernetescompat \
            ./internal/installer/sysextcatalog ./internal/installer/payloadbundle -count=1
      - name: Restore build caches
        if: steps.candidate.outputs.exists != 'true'
        uses: actions/cache@v6
        with:
          path: |
            _build/go-mod
            _build/go-cache
            _build/mkosi/package-cache
          key: kubernetes-${{ runner.os }}-${{ env.ARTIFACT_VERSION }}
          restore-keys: kubernetes-${{ runner.os }}-
      - name: Build compatible runtime and Kubernetes sysext
        if: steps.candidate.outputs.exists != 'true'
        run: |
          scripts/mkosi build-runtime
          scripts/build-kubernetes-sysext
      - name: Verify built runtime and Kubernetes sysext
        if: steps.candidate.outputs.exists != 'true'
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            --env KATL_ARCHITECTURE --env KATL_KUBERNETES_MINOR \
            --env KATL_KUBERNETES_PAYLOAD_VERSION --env KATL_KUBERNETES_KUBEADM_VERSION \
            --env KATL_KUBERNETES_KUBELET_VERSION --env KATL_KUBERNETES_KUBECTL_VERSION \
            --env KATL_KUBERNETES_CRITOOLS_VERSION "$KATL_MKOSI_IMAGE" \
            bash -euo pipefail -c 'scripts/check-runtime-root; scripts/check-kubernetes-sysext'
      - name: Stage Kubernetes payload bundle
        if: steps.candidate.outputs.exists != 'true'
        run: |
          go run ./cmd/katl-publish-kubernetes-sysext \
            --output-dir dist \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.version=${ARTIFACT_VERSION}" \
            --annotation "org.opencontainers.image.licenses=MIT" \
            --annotation "org.opencontainers.image.url=${KUBERNETES_RELEASE_URL}" \
            --annotation "dev.katl.kubernetes.payload.version=${PAYLOAD_VERSION}" \
            > staged.txt
      - name: Retain candidate build evidence
        if: steps.candidate.outputs.exists != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kubernetes-${{ env.ARTIFACT_VERSION }}
          path: |
            dist/
            candidate.json
            staged.txt
          if-no-files-found: error
      - name: Publish immutable OCI bundle
        if: env.PUBLISH == 'true' && steps.candidate.outputs.exists != 'true'
        run: |
          digest_tag="$(awk '$1 == "oci-manifest-tag:" {print $2}' staged.txt)"
          go run ./cmd/katl-publish-kubernetes-sysext \
            --output-dir dist \
            --publish-ref "${OCI_REPOSITORY}:${ARTIFACT_VERSION}" \
            --publish-ref "${OCI_REPOSITORY}:${digest_tag}" \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.version=${ARTIFACT_VERSION}" \
            --annotation "org.opencontainers.image.licenses=MIT" \
            --annotation "org.opencontainers.image.url=${KUBERNETES_RELEASE_URL}" \
            --annotation "dev.katl.kubernetes.payload.version=${PAYLOAD_VERSION}"
      - name: Resolve published identity
        if: env.PUBLISH == 'true' && steps.candidate.outputs.promoted != 'true'
        id: published
        run: |
          go run ./cmd/katl-kubernetes-release inspect \
            --payload-version "$PAYLOAD_VERSION" --artifact-version "$ARTIFACT_VERSION" > published.json
          jq -e '.exists == true' published.json
          echo "digest=$(jq -r .digest published.json)" >> "$GITHUB_OUTPUT"
      - name: Attest published OCI manifest
        if: env.PUBLISH == 'true' && steps.candidate.outputs.promoted != 'true'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.OCI_REPOSITORY }}
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true
      - name: Verify public bundle and provenance
        if: env.PUBLISH == 'true' && steps.candidate.outputs.promoted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          scripts/check-public-kubernetes-bundle "${OCI_REPOSITORY}:${ARTIFACT_VERSION}" "$MANIFEST_DIGEST"
          gh attestation verify "oci://${OCI_REPOSITORY}@${MANIFEST_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/kubernetes-bundles.yml" \
            --source-ref refs/heads/main
      - name: Promote compatible bundle
        if: env.PUBLISH == 'true' && steps.candidate.outputs.promoted != 'true'
        env:
          MANIFEST_DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          go run ./cmd/katl-kubernetes-release promote \
            --payload-version "$PAYLOAD_VERSION" --artifact-version "$ARTIFACT_VERSION" \
            --manifest-digest "$MANIFEST_DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"

  presubmit:
    name: Kubernetes Bundle Presubmit
    if: always() && github.event_name == 'pull_request'
    needs: [plan, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful producer validation
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_REQUIRED: ${{ needs.plan.outputs.build }}
        run: |
          test "$PLAN_RESULT" = success
          if [[ "$BUILD_REQUIRED" == true ]]; then
            test "$BUILD_RESULT" = success
          else
            test "$BUILD_RESULT" = skipped
          fi
