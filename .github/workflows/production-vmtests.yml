name: Production VM qualification

on:
  workflow_dispatch:
    inputs:
      flavour:
        description: Kernel flavour to qualify
        type: choice
        options:
          - standard
          - lts
        required: true
      artifact-name:
        description: Artifact containing the bundle to qualify
        type: string
        required: true
      run-id:
        description: Run that produced the bundle
        type: number
        required: true
      previous-tag:
        description: Stable release to upgrade from
        type: string
        required: true
  workflow_call:
    inputs:
      flavour:
        description: Kernel flavour to qualify
        type: string
        required: true
      artifact-name:
        description: Artifact containing the bundle to qualify
        type: string
        required: true
      previous-tag:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  qualification:
    name: Production VM (${{ inputs.flavour }})
    runs-on: ubuntu-24.04
    # Every step has a budget, so go test's -timeout 12m fires inside its
    # 14-minute step and before this timeout whenever setup stays within
    # budget.
    timeout-minutes: 85
    env:
      KATL_FLAVOUR: ${{ inputs.flavour }}
      KATL_VMTEST_KVM: 'on'
      KATL_VMTEST_KEEP: failed
      KATL_VMTEST_DEBUG_ON_FAILURE: '0'
      KATL_OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
      KATL_OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
      KATL_VMTEST_GO: ${{ github.workspace }}/.github/scripts/hosted-vmtest-go
      KATL_VMTEST_RELEASE_DIR: ${{ github.workspace }}/dist
      KATL_VMTEST_PREVIOUS_RELEASE_DIR: ${{ github.workspace }}/previous
      KATL_VMTEST_RUN_DIR: ${{ github.workspace }}/_build/production-vmtest
    defaults:
      run:
        shell: bash .github/scripts/ci-shell bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Set up tools
        uses: ./.github/actions/setup-tools
        timeout-minutes: 11
      - uses: ./.github/actions/hosted-vmtest
        timeout-minutes: 6
      - name: Download the candidate bundle
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ inputs.artifact-name }}
          BUNDLE_RUN: ${{ inputs.run-id > 0 && inputs.run-id || github.run_id }}
        run: .github/scripts/hosted-download artifact "$BUNDLE" dist "$BUNDLE_RUN"
      - name: Download the previous stable release
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ inputs.previous-tag }}
        run: .github/scripts/hosted-download release "$PREVIOUS_TAG" previous
      - name: Verify candidate and previous release checksums
        timeout-minutes: 2
        env:
          PREVIOUS_TAG: ${{ inputs.previous-tag }}
        run: |
          scripts/katl-release checksums dist
          scripts/katl-release checksums previous
          printf 'Upgrade source: %s\n' "$PREVIOUS_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Qualify production installation, reboot, upgrade, and rollback
        timeout-minutes: 14
        run: |
          .github/scripts/hosted-vmtest-measure production .github/scripts/hosted-vmtest-run \
            --artifact-set=none --no-rebuild ./internal/vmtest \
            -run '^TestReleaseLifecycle$' -count=1 -json -timeout 12m
      - uses: actions/upload-artifact@v7
        if: success() && inputs.run-id == 0
        timeout-minutes: 2
        with:
          name: katl-qualified-${{ inputs.flavour }}-${{ github.sha }}
          overwrite: true
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Collect diagnostics
        id: diagnostics
        if: always()
        shell: bash
        timeout-minutes: 2
        run: .github/scripts/hosted-vmtest-diagnostics
      - uses: actions/upload-artifact@v7
        if: always() && steps.diagnostics.outcome == 'success' && steps.diagnostics.outputs.upload-dir != ''
        timeout-minutes: 2
        with:
          name: production-vmtest-${{ inputs.flavour }}-${{ github.run_id }}
          path: ${{ steps.diagnostics.outputs.upload-dir }}
          retention-days: 3
