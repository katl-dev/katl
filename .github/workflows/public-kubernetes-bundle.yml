name: Public Kubernetes Bundles

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "matrix=$(go run ./cmd/katl-kubernetes-release discover)" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify ${{ matrix.release.payloadVersion }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve through the operator compatibility path
        id: bundle
        env:
          PAYLOAD_VERSION: ${{ matrix.release.payloadVersion }}
        run: |
          reference=$(go run ./cmd/katl-kubernetes-release resolve --payload-version "$PAYLOAD_VERSION" | jq -r .bundle)
          image="${reference%@*}"
          digest="${reference##*@}"
          scripts/check-public-kubernetes-bundle "$image" "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Authenticate provenance client
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Verify provenance
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_DIGEST: ${{ steps.bundle.outputs.digest }}
        run: |
          gh attestation verify "oci://ghcr.io/katl-dev/kubernetes@${MANIFEST_DIGEST}" \
            --repo katl-dev/katl \
            --signer-workflow katl-dev/katl/.github/workflows/kubernetes-bundles.yml \
            --source-ref refs/heads/main
