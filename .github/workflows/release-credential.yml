name: Check release credential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: Verify the publishing credential
        timeout-minutes: 2
        uses: ./.github/actions/release-credential
        with:
          app-id: ${{ vars.KATL_RELEASE_APP_ID }}
          private-key: ${{ secrets.KATL_RELEASE_APP_PRIVATE_KEY }}
      - name: Summarize the credential check
        timeout-minutes: 2
        run: |
          echo "The katl-release App minted a token scoped to this repository with Contents write permission. The token read repository contents." >> "$GITHUB_STEP_SUMMARY"
