name: Check release credential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify the publishing credential
        uses: ./.github/actions/release-credential
        with:
          app-id: ${{ vars.KATL_RELEASE_APP_ID }}
          private-key: ${{ secrets.KATL_RELEASE_APP_PRIVATE_KEY }}
      - name: Summarize the credential check
        run: |
          echo "The katl-release credential is ready for final publication." >> "$GITHUB_STEP_SUMMARY"
