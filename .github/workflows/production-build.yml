name: Katl Production Build

on:
  workflow_call:
    inputs:
      flavour:
        description: Kernel flavour to build (standard or lts)
        type: string
        required: true
      version:
        description: Canonical CalVer embedded in artifacts
        type: string
        required: true
      retention-days:
        description: Retention in days for the assembled artifact and extension publication inputs
        type: number
        required: true
    outputs:
      artifact:
        description: Assembled release artifact for this flavour
        value: ${{ jobs.assemble.outputs.artifact }}
      extension-bundles:
        description: Name of the extension publication inputs artifact for this flavour
        value: ${{ jobs.assemble.outputs.extension-bundles }}

permissions:
  contents: read
  actions: read # hosted-download reads this run's build handoffs.

env:
  KATL_FLAVOUR: ${{ inputs.flavour }}
  KATL_VERSION: ${{ inputs.version }}
  KATL_MKOSI_BUILD_DIR: ${{ github.workspace }}/_build/mkosi
  GOTOOLCHAIN: auto
  KATL_ARCHITECTURE: x86_64
  KATL_BUILD_COMMIT: ${{ github.sha }}
  KATL_CONTAINER_RUNTIME: docker
  KATL_MKOSI_IMAGE: localhost/katl-mkosi-builder:go-squashfs
  KATL_VMTEST_IMAGE_SUPPORT: "0"

jobs:
  runtime:
    name: Build And Verify Runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      mkosi-version: ${{ steps.mkosi-version.outputs.version }}
      extensions: ${{ steps.extensions.outputs.extensions }}

    steps:
      - name: Validate flavour
        timeout-minutes: 3
        shell: bash
        run: |
          case "$KATL_FLAVOUR" in
            standard | lts) ;;
            *)
              echo "unsupported flavour: $KATL_FLAVOUR" >&2
              exit 1
              ;;
          esac

      - name: Check out repository
        timeout-minutes: 5
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        timeout-minutes: 10
        uses: ./.github/actions/setup-go

      - name: Restore image build caches
        uses: ./.github/actions/image-caches
        timeout-minutes: 5
        continue-on-error: true
        with:
          flavour: ${{ inputs.flavour }}

      - name: Prepare pinned builder
        timeout-minutes: 20
        uses: ./.github/actions/mkosi-builder
        with:
          image: ${{ env.KATL_MKOSI_IMAGE }}

      - name: Build runtime
        timeout-minutes: 30
        shell: bash
        run: scripts/mkosi build-runtime

      - name: Build endpoint advertiser sysext
        timeout-minutes: 10
        shell: bash
        run: scripts/build-endpoint-advertiser-sysext

      - name: Resolve mkosi version
        timeout-minutes: 5
        id: mkosi-version
        shell: bash
        run: |
          version="$(docker run --rm "$KATL_MKOSI_IMAGE" mkosi --version)"
          version="${version#mkosi }"
          if [[ ! "$version" =~ ^[0-9]+([.][0-9]+)*$ ]]; then
            echo "unexpected mkosi version from builder: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify runtime
        timeout-minutes: 10
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            "$KATL_MKOSI_IMAGE" \
            bash -euo pipefail -c '
              scripts/check-runtime-root
              scripts/check-runtime-boot-asset
            '

      - name: Upload runtime build inputs
        timeout-minutes: 10
        uses: actions/upload-artifact@v7
        with:
          name: katl-runtime-${{ inputs.flavour }}-${{ github.sha }}
          path: |
            _build/mkosi/katl-runtime-root.squashfs*
            _build/mkosi/katl-kernel-lock.json
            _build/mkosi/katl-kernel-inputs.tar*
            _build/mkosi/katl-endpoint-advertiser.raw*
            _build/mkosi/katl-runtime.efi*
            _build/mkosi/katl-runtime.packages.tsv
          if-no-files-found: error
          retention-days: 1
          compression-level: 0


      - name: Inventory release extensions
        timeout-minutes: 5
        id: extensions
        shell: bash
        run: |
          inventory="$(go run ./cmd/katl-mkosi-artifacts inventory-release-extensions)"
          echo "extensions=$(jq -c .extension <<<"$inventory")" >> "$GITHUB_OUTPUT"

  installer:
    name: Build And Verify Installer
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Validate flavour
        timeout-minutes: 3
        shell: bash
        run: |
          case "$KATL_FLAVOUR" in
            standard | lts) ;;
            *)
              echo "unsupported flavour: $KATL_FLAVOUR" >&2
              exit 1
              ;;
          esac

      - name: Check out repository
        timeout-minutes: 5
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        timeout-minutes: 10
        uses: ./.github/actions/setup-go

      - name: Restore image build caches
        uses: ./.github/actions/image-caches
        timeout-minutes: 5
        continue-on-error: true
        with:
          flavour: ${{ inputs.flavour }}

      - name: Prepare pinned builder
        timeout-minutes: 20
        uses: ./.github/actions/mkosi-builder
        with:
          image: ${{ env.KATL_MKOSI_IMAGE }}

      - name: Build installer
        timeout-minutes: 20
        shell: bash
        run: scripts/mkosi build-installer

      - name: Verify installer
        timeout-minutes: 10
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            "$KATL_MKOSI_IMAGE" \
            scripts/check-installer-image

      - name: Upload installer intermediates
        timeout-minutes: 10
        uses: actions/upload-artifact@v7
        with:
          name: katl-installer-${{ inputs.flavour }}-${{ github.sha }}
          path: |
            _build/mkosi/katl-installer.efi
            _build/mkosi/katl-installer.efi.json
            _build/mkosi/katl-installer.efi.sha256
            _build/mkosi/katl-installer.initrd
            _build/mkosi/katl-installer.initrd.json
            _build/mkosi/katl-installer.initrd.sha256
            _build/mkosi/katl-installer.packages.tsv
            _build/mkosi/katl-installer.vmlinuz
            _build/mkosi/katl-installer.vmlinuz.json
            _build/mkosi/katl-installer.vmlinuz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  extensions:
    name: Build Extension (${{ matrix.extension }})
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(needs.runtime.outputs.extensions) }}

    steps:
      - name: Validate flavour
        timeout-minutes: 3
        shell: bash
        run: |
          case "$KATL_FLAVOUR" in
            standard | lts) ;;
            *)
              echo "unsupported flavour: $KATL_FLAVOUR" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        timeout-minutes: 10
      - uses: ./.github/actions/mkosi-builder
        timeout-minutes: 20
        with:
          image: ${{ env.KATL_MKOSI_IMAGE }}
      - name: Download runtime build inputs
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          KATL_DOWNLOAD_ATTEMPT_SECONDS: 180
          RUNTIME_INPUTS: katl-runtime-${{ inputs.flavour }}-${{ github.sha }}
        run: .github/scripts/hosted-download artifact "$RUNTIME_INPUTS" _build/mkosi
      - name: Install module inspection tools
        timeout-minutes: 10
        run: .github/scripts/hosted-apt-install systemd-container kmod squashfs-tools

      - name: Build and verify release recipe
        timeout-minutes: 20
        run: scripts/build-release-extensions "${{ matrix.extension }}"
      - name: Upload verified extension closure
        timeout-minutes: 10
        uses: actions/upload-artifact@v7
        with:
          name: katl-extension-${{ inputs.flavour }}-${{ matrix.extension }}-${{ github.sha }}
          path: _build/mkosi/release-extensions/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0


  assemble:
    name: Assemble And Verify Katl Release
    needs: [runtime, extensions, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 185
    outputs:
      artifact: ${{ steps.names.outputs.artifact }}
      extension-bundles: ${{ steps.names.outputs.extension-bundles }}

    steps:
      - name: Validate flavour
        timeout-minutes: 3
        shell: bash
        run: |
          case "$KATL_FLAVOUR" in
            standard | lts) ;;
            *)
              echo "unsupported flavour: $KATL_FLAVOUR" >&2
              exit 1
              ;;
          esac

      - name: Check out repository
        timeout-minutes: 5
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        timeout-minutes: 10
        uses: ./.github/actions/setup-go

      - name: Prepare pinned builder
        timeout-minutes: 20
        uses: ./.github/actions/mkosi-builder
        with:
          image: ${{ env.KATL_MKOSI_IMAGE }}

      - name: Download runtime build inputs
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          KATL_DOWNLOAD_ATTEMPT_SECONDS: 180
          RUNTIME_INPUTS: katl-runtime-${{ inputs.flavour }}-${{ github.sha }}
        run: .github/scripts/hosted-download artifact "$RUNTIME_INPUTS" _build/mkosi

      - name: Install assembly tools
        timeout-minutes: 10
        run: .github/scripts/hosted-apt-install systemd-container kmod squashfs-tools dosfstools mtools xorriso

      - name: Download release extension closures
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          KATL_DOWNLOAD_ATTEMPT_SECONDS: 180
          EXTENSIONS: katl-extension-${{ inputs.flavour }}-*-${{ github.sha }}
        run: |
          .github/scripts/hosted-download artifacts "$EXTENSIONS" _build/import/release-extensions
          # Each closure artifact holds one extension's directory.
          mkdir -p _build/mkosi/release-extensions
          mv -t _build/mkosi/release-extensions _build/import/release-extensions/*/*
      - name: Assemble and verify complete extension selection
        timeout-minutes: 10
        run: scripts/assemble-release-extensions

      - name: Package install and upgrade images concurrently
        timeout-minutes: 15
        shell: bash
        env:
          KATL_EXTENSION_RELEASE: _build/mkosi/release-extensions.json
        run: |
          install_status=0
          upgrade_status=0
          scripts/build-katlos-install-image &
          install_pid=$!
          KATL_KATLOS_IMAGE_ROLE=upgrade scripts/build-katlos-install-image &
          upgrade_pid=$!
          wait "$install_pid" || install_status=$?
          wait "$upgrade_pid" || upgrade_status=$?
          ((install_status == 0 && upgrade_status == 0))

      - name: Verify KatlOS images
        timeout-minutes: 15
        shell: bash
        run: |
          scripts/check-katlos-install-image
          KATL_KATLOS_IMAGE_ROLE=upgrade scripts/check-katlos-install-image
          CGO_ENABLED=0 go test -c -o _build/extension-closure.test ./internal/installer/katlosimage
          for role in install upgrade; do
            docker run --rm \
              --volume "$GITHUB_WORKSPACE:/work" \
              --workdir /work \
              --env "KATL_TEST_KATLOS_IMAGE=/work/_build/mkosi/katlos-${role}-${KATL_VERSION}-${KATL_ARCHITECTURE}.squashfs" \
              "$KATL_MKOSI_IMAGE" \
              /work/_build/extension-closure.test \
                -test.run '^TestBuiltImage(ExtensionClosure|IndexReadableByBeta14)$' -test.count=1 -test.v
          done

      - name: Download installer intermediates
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          KATL_DOWNLOAD_ATTEMPT_SECONDS: 180
          INSTALLER: katl-installer-${{ inputs.flavour }}-${{ github.sha }}
        run: .github/scripts/hosted-download artifact "$INSTALLER" _build/mkosi

      - name: Build katlctl
        timeout-minutes: 10
        shell: bash
        run: |
          scripts/katl-release-artifacts build-katlctl "$KATL_VERSION"
          scripts/katl-release-artifacts verify-katlctl "$KATL_VERSION"

      - name: Assemble and verify installer ISO
        timeout-minutes: 10
        shell: bash
        run: |
          scripts/build-installer-iso >/dev/null
          go run ./cmd/katl-mkosi-artifacts write-installer-artifacts >/dev/null
          scripts/check-installer-iso

      - name: Record release build inputs
        timeout-minutes: 5
        shell: bash
        env:
          MKOSI_VERSION: ${{ needs.runtime.outputs.mkosi-version }}
        run: |
          go run ./cmd/katl-resource-lock prepare-mkosi \
            -manifest _build/mkosi/katl-release-build-inputs.json \
            -mode record \
            -run-id "release-${KATL_VERSION}-${GITHUB_SHA:0:12}" \
            -git-revision "$GITHUB_SHA" \
            -mkosi-version "$MKOSI_VERSION" \
            -package-set installer-image \
            -package-set runtime \
            -package-set katlos-install-image

      - name: Stage supported publication artifacts
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/katl-release-artifacts stage "$KATL_VERSION" dist

      - name: Resolve artifact names
        timeout-minutes: 3
        id: names
        shell: bash
        run: |
          echo "artifact=katl-assembled-${KATL_FLAVOUR}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "extension-bundles=katl-extension-bundles-${KATL_FLAVOUR}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Actions artifact
        timeout-minutes: 10
        uses: actions/upload-artifact@v7
        with:
          name: katl-assembled-${{ inputs.flavour }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          compression-level: 0

      - name: Upload extension publication inputs
        timeout-minutes: 10
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.extension-bundles }}
          path: |
            _build/mkosi/release-extensions.json
            _build/mkosi/extension-bundles/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          compression-level: 0

      - name: Record disk margin
        timeout-minutes: 3
        if: always()
        run: df -h /
