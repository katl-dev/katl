name: Update Kernel Flavour

on:
  workflow_call:
    inputs:
      fedora-release:
        type: string
        default: ''
      flavour:
        required: true
        type: string
      kernel-release:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: kernel-inputs-${{ inputs.flavour }}-${{ github.ref }}
  cancel-in-progress: false

env:
  KATL_FLAVOUR: ${{ inputs.flavour }}

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      fedora-release: ${{ steps.capture.outputs.fedora-release }}
      matches-base: ${{ steps.capture.outputs.matches-base }}
    env:
      KATL_CONTAINER_RUNTIME: docker
      KATL_MKOSI_IMAGE: localhost/katl-kernel-inputs:builder
      KERNEL_RELEASE: ${{ inputs.kernel-release }}
      FEDORA_RELEASE: ${{ inputs.fedora-release }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/mkosi-builder
        with:
          image: ${{ env.KATL_MKOSI_IMAGE }}
      - name: Capture signed kernel RPMs once
        id: capture
        run: |
          base_release="$(scripts/fedora-release)"
          fedora_release="${FEDORA_RELEASE:-$base_release}"
          scripts/mkosi box -- go run ./cmd/katl-kernel-release candidate \
            --fedora-release "$fedora_release" --flavour "$KATL_FLAVOUR" \
            --kernel-release "$KERNEL_RELEASE" --output "_build/kernel-candidates/$KATL_FLAVOUR"
          {
            echo "fedora-release=$fedora_release"
            if [[ "$fedora_release" == "$base_release" ]]; then
              echo 'matches-base=true'
            else
              echo 'matches-base=false'
            fi
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: kernel-candidates-${{ inputs.flavour }}
          path: _build/kernel-candidates/${{ inputs.flavour }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  publish:
    timeout-minutes: 30
    needs: capture
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # Publication executes only helper code from the trusted workflow source.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: kernel-candidates-${{ inputs.flavour }}
          path: _build/kernel-candidates/${{ inputs.flavour }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Retain the signed RPM bytes
        # Native OCI idempotence also repairs interrupted publication on reruns.
        run: |
          go run ./cmd/katl-kernel-release publish \
            --lock "_build/kernel-candidates/$KATL_FLAVOUR/lock.json" \
            --layout "_build/kernel-candidates/$KATL_FLAVOUR/layout"

  verify:
    timeout-minutes: 15
    needs: [capture, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: kernel-candidates-${{ inputs.flavour }}
          path: _build/kernel-candidates/${{ inputs.flavour }}
      - name: Verify anonymous availability of every retained RPM
        run: |
          go run ./cmd/katl-kernel-release verify \
            --lock "_build/kernel-candidates/$KATL_FLAVOUR/lock.json" \
            --cache "_build/public-verification/$KATL_FLAVOUR"
          mkdir -p _build/kernel-locks
          cp "_build/kernel-candidates/$KATL_FLAVOUR/lock.json" "_build/kernel-locks/$KATL_FLAVOUR.json"
      - uses: actions/upload-artifact@v7
        with:
          name: kernel-lock-fedora-${{ needs.capture.outputs.fedora-release }}-${{ inputs.flavour }}
          path: _build/kernel-locks/${{ inputs.flavour }}.json
          retention-days: 7
          if-no-files-found: error
      - name: Record prepared inputs
        env:
          FEDORA_RELEASE: ${{ needs.capture.outputs.fedora-release }}
          MATCHES_BASE: ${{ needs.capture.outputs.matches-base }}
        run: |
          jq '{fedoraRelease, flavour, kernelRelease, reference}' \
            "_build/kernel-locks/$KATL_FLAVOUR.json" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$MATCHES_BASE" != true ]]; then
            echo 'Inputs are retained and anonymously retrievable. No update PR is created for this base change; kernel qualification still requires builds and tests with the new Fedora base.' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\nDownload lock: `gh run download %s --repo %s --name kernel-lock-fedora-%s-%s --dir kernels/fedora-%s/x86_64`.\n' \
            "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$FEDORA_RELEASE" "$KATL_FLAVOUR" "$FEDORA_RELEASE" >> "$GITHUB_STEP_SUMMARY"

  propose:
    timeout-minutes: 10
    if: needs.capture.outputs.matches-base == 'true'
    needs: [capture, verify]
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.propose.outputs.changed }}
      branch: ${{ steps.propose.outputs.branch }}
      commit: ${{ steps.propose.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: kernel-lock-fedora-${{ needs.capture.outputs.fedora-release }}-${{ inputs.flavour }}
          path: _build/kernel-locks/${{ inputs.flavour }}
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.KATL_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.KATL_AUTOMATION_PRIVATE_KEY }}
          permission-contents: write
      - id: propose
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p "_build/kernel-candidates/$KATL_FLAVOUR"
          cp "_build/kernel-locks/$KATL_FLAVOUR/$KATL_FLAVOUR.json" \
            "_build/kernel-candidates/$KATL_FLAVOUR/lock.json"
          go run ./cmd/katl-kernel-release propose --flavour "$KATL_FLAVOUR" > proposal.json
          jq -r 'to_entries[] | "\(.key)=\(.value)"' proposal.json >> "$GITHUB_OUTPUT"

  pull-request:
    timeout-minutes: 10
    if: needs.propose.outputs.changed == 'true'
    needs: [capture, propose]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: kernel-lock-fedora-${{ needs.capture.outputs.fedora-release }}-${{ inputs.flavour }}
          path: _build/kernel-locks/${{ inputs.flavour }}
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.KATL_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.KATL_AUTOMATION_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
      - name: Open the proposal for CI
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ needs.propose.outputs.branch }}
          PROPOSED_COMMIT: ${{ needs.propose.outputs.commit }}
        run: |
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)"
          [[ "$actual" == "$PROPOSED_COMMIT" ]] || { echo 'candidate changed after capture; rerun the workflow' >&2; exit 1; }
          {
            echo 'Select retained kernel RPMs for reproducible runtime, installer, and extension builds.'
            echo
            jq -r '"- **\(.flavour):** `\(.kernelRelease)`"' "_build/kernel-locks/$KATL_FLAVOUR/$KATL_FLAVOUR.json"
            echo
            printf 'Signed RPMs for `%s` were captured and retained by [Kernel Updates](%s/%s/actions/runs/%s).\n' \
              "$PROPOSED_COMMIT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            echo
            echo 'CI requires boot, lifecycle, cluster, extension composition, and production DRBD tests for each changed kernel flavour before auto-merge. NVIDIA hardware behavior requires separate hardware qualification.'
          } > body.md
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --base main --body-file body.md
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "kernel: update retained $KATL_FLAVOUR kernel inputs" --body-file body.md
          fi
