name: Combine flavours
description: Download the assembled flavours of this commit and merge them into dist/.
runs:
  using: composite
  steps:
    - name: Download assembled flavours
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        FLAVOURS: katl-assembled-*-${{ github.sha }}
      run: .github/scripts/hosted-download artifacts "$FLAVOURS" flavours
    - name: Combine flavours
      shell: bash
      run: |
        scripts/katl-release-artifacts combine dist "standard=flavours/katl-assembled-standard-$GITHUB_SHA" "lts=flavours/katl-assembled-lts-$GITHUB_SHA"
