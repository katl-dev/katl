name: Verify a GitHub App credential
description: Mint a repository-scoped GitHub App token and verify its read access.
inputs:
  app-id:
    description: ID of the GitHub App
    required: true
  private-key:
    description: Private key of the GitHub App
    required: true
  environment:
    description: Deployment environment that holds the App ID variable and private key secret
    required: true
outputs:
  token:
    description: Installation token for the release repository
    value: ${{ steps.mint.outputs.token }}
runs:
  using: composite
  steps:
    - name: Mint the App token
      id: mint
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
    - name: Report a token mint failure
      if: failure() && steps.mint.outcome == 'failure'
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        echo "::error::Could not mint the App token. Check the $ENVIRONMENT environment's App ID variable and private key secret, and confirm that the App is installed on this repository with Contents write permission."
    - name: Verify installation scope and repository access
      shell: bash
      env:
        GH_TOKEN: ${{ steps.mint.outputs.token }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        if ! repositories="$(gh api --method GET --paginate /installation/repositories --jq '.repositories[].full_name')" ||
          [[ "${repositories,,}" != "${GITHUB_REPOSITORY,,}" ]]; then
          echo "::error::The App token from the $ENVIRONMENT environment must list only $GITHUB_REPOSITORY. Check that the App installation covers this repository and the token request selects only this repository, then rerun the check."
          exit 1
        fi
        if ! gh api --method GET "/repos/$GITHUB_REPOSITORY/contents" > /dev/null; then
          echo "::error::Could not read repository contents with the App token from the $ENVIRONMENT environment. Check that the App installation on $GITHUB_REPOSITORY has approved Contents write permission."
          exit 1
        fi
