name: Prepare mkosi builder
description: Pull the builder that mkosi-builder.lock pins, or build Containerfile.mkosi when it pins none
inputs:
  image:
    description: Local image tag consumed by scripts/mkosi
    required: true
outputs:
  reference:
    description: Immutable image the job runs
    value: ${{ steps.builder.outputs.reference }}
  source:
    description: pinned when the committed digest was pulled, built when Containerfile.mkosi was built locally
    value: ${{ steps.builder.outputs.source }}
  digest:
    description: Pinned registry digest; empty for a local build
    value: ${{ steps.builder.outputs.digest }}
runs:
  using: composite
  steps:
    - name: Configure build downloads
      shell: bash
      run: |
        mkdir -p mkosi.conf.d
        action_dir="${GITHUB_ACTION_PATH#"$GITHUB_WORKSPACE"/}"
        # Fetch metadata and RPMs from the same canonical repository.
        cat > mkosi.conf.d/ci-downloads.conf <<EOF
        [Distribution]
        Mirror=https://dl.fedoraproject.org/pub/fedora

        [Build]
        SandboxTrees=.github/actions/mkosi-builder/sandbox
        # Keep the builder's DNF binary available behind the sandbox wrapper.
        SandboxTrees=$action_dir/dnf5:/usr/bin/dnf5
        SandboxTrees=/usr/bin/dnf5:/usr/libexec/katl-dnf5
        EOF
    - id: builder
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        KATL_REPO_ROOT: ${{ github.workspace }}
      # The action's own copy of the owner resolves the checked-out source, so
      # a source revision that predates the pin builds its own Containerfile.
      # The record also goes to the job summary as the job's builder evidence.
      run: |
        mkdir -p _build
        "$GITHUB_ACTION_PATH/../../../scripts/mkosi-builder" prepare "${KATL_CONTAINER_RUNTIME:-docker}" "$IMAGE" \
          > _build/mkosi-builder.txt
        cat _build/mkosi-builder.txt
        grep -E '^(reference|source|digest)=' _build/mkosi-builder.txt >> "$GITHUB_OUTPUT"
