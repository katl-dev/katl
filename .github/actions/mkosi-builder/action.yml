name: Prepare mkosi builder
description: Load the builder image using a shared Docker layer cache
inputs:
  image:
    description: Local image tag consumed by scripts/mkosi
    required: true
runs:
  using: composite
  steps:
    - name: Configure build downloads
      shell: bash
      run: |
        mkdir -p mkosi.conf.d
        # Fetch metadata and RPMs from the same canonical repository.
        cat > mkosi.conf.d/ci-downloads.conf <<'EOF'
        [Distribution]
        Mirror=https://dl.fedoraproject.org/pub/fedora

        [Build]
        SandboxTrees=.github/actions/mkosi-builder/sandbox
        EOF
    - id: fedora
      shell: bash
      run: echo "release=$(scripts/fedora-release)" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v4
    - uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_RECORD_UPLOAD: "false"
      with:
        context: .
        file: Containerfile.mkosi
        load: true
        tags: ${{ inputs.image }}
        build-args: FEDORA_RELEASE=${{ steps.fedora.outputs.release }}
        # Refresh the Fedora base; unchanged layers reuse the cached tools.
        pull: true
        cache-from: type=gha,scope=mkosi-builder
        cache-to: type=gha,scope=mkosi-builder,mode=max
