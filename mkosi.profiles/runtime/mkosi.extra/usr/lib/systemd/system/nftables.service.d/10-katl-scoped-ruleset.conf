[Service]
# Kubernetes networking owns its own nftables and iptables-nft tables. The
# operator ruleset must manage only its own tables, so reload reapplies that
# file and stop leaves the loaded rules in place instead of flushing every
# table on the node.
ExecReload=
ExecReload=/usr/bin/nft -f /etc/sysconfig/nftables.conf
ExecStop=
