[Service]
# Generation activation sets the host hostname but does not install mounts.
CapabilityBoundingSet=CAP_SYS_ADMIN
PrivateDevices=yes
# Early extension activation cannot wait for systemd-tmpfiles-setup.service.
PrivateTmp=disconnected
ProtectClock=yes
ProtectControlGroups=yes
ProtectHome=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectSystem=strict
# The activator owns and recreates its directories below this stable parent.
ReadWritePaths=/run /var/lib/katl/boot /var/lib/katl/generations
RestrictAddressFamilies=AF_UNIX
RestrictNamespaces=yes
RestrictSUIDSGID=yes
SystemCallFilter=@system-service sethostname
SystemCallErrorNumber=EPERM
