[Service]
# TIOCL_SETKMSGREDIRECT requires CAP_SYS_ADMIN to keep kernel logs on tty3.
CapabilityBoundingSet=CAP_SYS_ADMIN
AmbientCapabilities=
DevicePolicy=closed
DeviceAllow=/dev/tty1 rw
DeviceAllow=/dev/tty3 w
PrivateTmp=yes
ProtectClock=yes
ProtectControlGroups=yes
ProtectHome=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectSystem=strict
RuntimeDirectory=katl/console
# The installer publishes the handoff here independently of console restarts.
RuntimeDirectoryPreserve=yes
ReadWritePaths=/run/katl/console
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
RestrictNamespaces=yes
RestrictSUIDSGID=yes
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
UMask=0077
