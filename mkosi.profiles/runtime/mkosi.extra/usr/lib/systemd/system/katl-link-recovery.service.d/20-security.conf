[Service]
# networkctl reconfigures through systemd-networkd's D-Bus API, and the
# grace-period deadlines start their timers through systemctl. Both
# authorise the root caller without a capability.
CapabilityBoundingSet=
IPAddressDeny=any
PrivateDevices=yes
PrivateTmp=yes
ProtectClock=yes
ProtectControlGroups=yes
ProtectHome=yes
ProtectHostname=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectSystem=strict
RestrictAddressFamilies=AF_UNIX AF_NETLINK
RestrictNamespaces=yes
RestrictSUIDSGID=yes
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
