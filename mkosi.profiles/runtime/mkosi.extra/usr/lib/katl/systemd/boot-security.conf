[Service]
# bootctl must clear immutable flags when updating existing EFI variables.
CapabilityBoundingSet=CAP_SYS_ADMIN CAP_LINUX_IMMUTABLE
PrivateTmp=yes
ProtectClock=yes
ProtectControlGroups=yes
ProtectHome=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectSystem=strict
ReadWritePaths=/efi -/sys/firmware/efi/efivars /var/lib/katl/boot /var/lib/katl/generations -/run/katl
RestrictAddressFamilies=AF_UNIX AF_NETLINK
RestrictNamespaces=yes
RestrictSUIDSGID=yes
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
