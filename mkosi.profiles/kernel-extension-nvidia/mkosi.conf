[Output]
Format=sysext
Output=katl-nvidia
ImageId=katl-nvidia
Overlay=yes

[Content]
Bootable=no
BuildPackages=
        gcc
        gcc-c++
        make
        binutils
        elfutils-libelf-devel
        gawk
        hostname
        dwarves
        kmod
        tar
        gzip
        golang
        # The driver runfile decompresses with any zstd on PATH. Without the
        # rpmdb, the overlay installs libzstd from the live repos while the
        # runtime's zstd stays, and the zstd CLI refuses a library of any
        # other version. Installing zstd here takes both from one transaction.
        zstd

[Build]
BuildSources=../..
WithNetwork=no
