[Journal]
# Keep the local VGA terminal as /dev/console for virtual media users while
# mirroring the installer journal to ttyS0 for deterministic automation.
ForwardToConsole=yes
TTYPath=/dev/ttyS0
MaxLevelConsole=info
# Leave kernel auditing as the kernel booted, which is off unless audit=1 is
# passed. Without an audit daemon the kernel prints every record on the
# console, where a record from each unit start lands inside the lines above.
Audit=keep
