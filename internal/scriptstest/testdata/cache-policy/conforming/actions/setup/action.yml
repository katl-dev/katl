name: Set up Go
outputs:
  cache-key:
    value: ${{ steps.cache.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        cache: false
    - id: paths
      shell: bash
      run: echo "platform=$RUNNER_OS" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@v6
      with:
        path: go
        key: go-${{ steps.paths.outputs.platform }}-${{ hashFiles('go.sum') }}
