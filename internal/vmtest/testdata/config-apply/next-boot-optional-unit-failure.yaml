apiVersion: katl.dev/v1alpha1
kind: NodeConfigurationChange
metadata:
  sourceID: operator
  desiredVersion: "24"
apply:
  mode: next-boot
spec:
  clusterDefaults:
    hostConfiguration:
      enabledUnits:
        - vmtest-optional-failure.service
      sets:
        vmtest-optional-failure:
          files:
            - path: /etc/systemd/system/vmtest-optional-failure.service
              content: |
                [Unit]
                Description=Fail an optional service before Katl boot health
                Before=katl-boot-health.service

                [Service]
                Type=oneshot
                ExecStart=/usr/bin/false

                [Install]
                WantedBy=multi-user.target
