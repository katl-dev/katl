apiVersion: katl.dev/v1alpha1
kind: NodeConfigurationChange
metadata:
  sourceID: storage-operator
  desiredVersion: "4"
spec:
  nodeOverrides:
    cp-1:
      volumes:
        - name: data
          selector:
            partition: {}
          filesystem: xfs
        - name: scratch
          selector:
            partition:
              byVolumeName: true
          filesystem: xfs
          wipe: true
