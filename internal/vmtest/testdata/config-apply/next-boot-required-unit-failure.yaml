apiVersion: katl.dev/v1alpha1
kind: NodeConfigurationChange
metadata:
  sourceID: operator
  desiredVersion: "23"
apply:
  mode: next-boot
spec:
  clusterDefaults:
    hostConfiguration:
      enabledUnits:
        - vmtest-boot-failure.service
      sets:
        vmtest-boot-failure:
          files:
            - path: /etc/systemd/system/vmtest-boot-failure.service
              content: |
                [Unit]
                Description=Fail the Katl VM trial boot
                Before=katl-boot-health.service

                [Service]
                Type=oneshot
                ExecStart=/usr/bin/false

                [Install]
                RequiredBy=katl-boot-health.service
