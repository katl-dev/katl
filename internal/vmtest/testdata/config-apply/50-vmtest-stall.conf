[Service]
# The production supervisor runs a command that can only end by expiry. The
# command finds the supervisor's instance from its armed record in this
# unit's journal. The ":" prefix leaves variable expansion to the shell.
ExecStart=
ExecStart=:/usr/bin/katlc agent run-extension-activation /usr/bin/sh -ec '\
    /usr/bin/sleep infinity & blocked=$!; \
    until armed=$(/usr/bin/journalctl -b -u katl-system-extensions-activate.service --no-pager -q -o cat --grep="^armed extension-activation deadline [0-9a-f]{32}"); test -n "$armed"; do /usr/bin/sleep 1; done; \
    instance=${armed##* }; \
    test "$(/usr/bin/systemctl show --property=ActiveState --value "katl-deadline-extension-activation@${instance}.timer")" = inactive; \
    kill -0 "$blocked"; echo "vmtest stall: configured unit activation blocked"; \
    /usr/bin/systemctl start --no-block "katl-deadline-expire@${instance}.service"; wait "$blocked"'
