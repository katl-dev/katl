apiVersion: katl.dev/v1alpha1
kind: NodeConfigurationChange
metadata:
  sourceID: operator
  desiredVersion: "20"
apply:
  mode: live
spec:
  clusterDefaults:
    hostConfiguration:
      sets:
        rejected-modules:
          files:
            - path: /etc/modprobe.d/80-vmtest-rejected.conf
              content: |
                options loop max_loop=64
