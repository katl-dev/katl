apiVersion: katl.dev/v1alpha1
kind: NodeConfigurationChange
metadata:
  sourceID: operator
  desiredVersion: "20"
apply:
  mode: live
spec:
  clusterDefaults:
    hostConfiguration:
      sets:
        rejected-network:
          files:
            - path: /etc/systemd/network/20-vmtest-rejected.network
              content: |
                [Match]
                Name=*
                [Network]
                DHCP=yes
